name: rust-flake-rerun

# The Mac stays on main (Ethan, 2026-10-24). The builder only activates a main
# commit whose `rust` and `checks` runs passed, and it already re-reads a red
# commit's verdict in case a re-run turned it green
# (scripts/rust-auto-build-authority.sh). Nothing ever re-ran one, so a single
# flaky e2e spec held every deploy: on 2026-10-24 four main runs in a row went
# red, each on a different spec (board-keeps-unchanged-columns, db-ask,
# offline-prefetch-one-tab, mdai-pages), and the server stayed 79 commits
# behind main.
#
# This re-runs the failed jobs of a red main `rust` run ONCE, and only when
# every failed job is an e2e job or a test shard whose test archive arrived
# truncated, so none of its tests ran (scripts/rust-flake-rerun-classify.sh). Playwright keeps retries: 0, so attempt 1 still
# records the failure and its evidence; a real regression fails attempt 2 as
# well and main stays red. A compile, clippy or unit-test failure is never
# re-run. Each re-run leaves a warning annotation and a job summary naming the
# failed jobs, so a spec that keeps needing one shows up.

on:
  workflow_run:
    workflows: ['rust']
    types: [completed]
    branches: [main]

permissions:
  actions: write
  contents: read

jobs:
  rerun-flaky-e2e:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/rust-flake-rerun-classify.sh
          sparse-checkout-cone-mode: false
      - name: Re-run failed flaky jobs once
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          failed=$(gh api "repos/$REPO/actions/runs/$RUN_ID/attempts/1/jobs?per_page=100" --paginate \
            --jq '.jobs[] | select(.conclusion == "failure") | "\(.id)\t\(.name)"')
          {
            echo "### rust run $RUN_ID on ${SHA:0:9}"
            echo
            printf '%s\n' "$failed" | cut -f2 | sed '/^$/d; s/^/- /'
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          if ! verdict=$(printf '%s\n' "$failed" | scripts/rust-flake-rerun-classify.sh); then
            echo "Not re-run: $verdict" >> "$GITHUB_STEP_SUMMARY"
            echo "$verdict run=$RUN_ID sha=$SHA"
            exit 0
          fi
          echo "Re-running the failed jobs once: $verdict" >> "$GITHUB_STEP_SUMMARY"
          echo "::warning title=flake_rerun::rust run $RUN_ID (${SHA:0:9}) failed only flaky jobs; re-running them once: $verdict"
          gh run rerun "$RUN_ID" --failed -R "$REPO"
          echo "verdict=flake_rerun_started run=$RUN_ID sha=$SHA"
