name: Cloud hotfix — repair Claude CLI in running containers

# Stopgap while ghcr.io/mixpeek/amux:latest cannot be pushed from CI
# (GITHUB_TOKEN lacks write_package on the mixpeek org). The image ships a
# claude with no native binary; this repairs it in place so existing workspaces
# work today. The durable fix is the Dockerfile + cloud-image.yml once the
# package grants this repo write access.

on:
  workflow_dispatch:

env:
  CLOUD_HOST: ${{ vars.CLOUD_HOST || '34.121.177.76' }}

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.CLOUD_SSH_KEY }}" > ~/.ssh/amux_cloud
          chmod 600 ~/.ssh/amux_cloud
          ssh-keyscan -H "$CLOUD_HOST" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Repair claude in every running container
        run: |
          ssh -i ~/.ssh/amux_cloud root@"$CLOUD_HOST" 'bash -s' <<'ENDSSH'
            echo "host arch: $(uname -m)"
            for c in $(docker ps --filter name=amux-user- --format '{{.Names}}'); do
              echo "=== $c ==="
              before=$(docker exec "$c" claude --version 2>&1 | head -1)
              echo "  before: $before"
              case "$before" in
                *[0-9].[0-9]*)
                  echo "  already healthy"
                  continue ;;
              esac
              # Diagnose: a wrong-architecture binary reports 'exec format error'.
              echo "  container arch: $(docker exec "$c" uname -m 2>&1) / node $(docker exec "$c" node -p 'process.arch' 2>&1)"
              # Reinstall from scratch so the postinstall resolves the binary for
              # the architecture actually running, not the one that built the image.
              docker exec "$c" sh -lc '
                npm uninstall -g @anthropic-ai/claude-code >/dev/null 2>&1 || true
                rm -f /usr/local/bin/claude
                npm install -g @anthropic-ai/claude-code 2>&1 | tail -3
              ' || true
              after=$(docker exec "$c" claude --version 2>&1 | head -1)
              echo "  after:  $after"
            done
          ENDSSH
