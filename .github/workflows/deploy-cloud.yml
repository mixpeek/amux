name: Deploy to cloud.amux.io

# RUST CUTOVER (AMUX-2619). The previous version of this file rsync'd
# `amux-server.py` onto the host and touched it to restart every container. That
# file was deleted from the repo (792ce1f) and this workflow went with it, which
# is why no cloud image could be built from main at all.
#
# The deploy unit is now the IMAGE, not a file under a running container:
#   build -> ghcr.io/mixpeek/amux:{latest,<sha>}  (same registry as before)
#   host  -> gateway.py + compose template + `docker pull`
#
# It deliberately does NOT recreate running workspaces by default — see the
# `recreate` input on the redeploy job. A recreate stops every tmux session in a
# customer's workspace, and the rust server does not implement the
# AMUX_AUTOSTART_SESSIONS restore the python image had, so nothing brings them
# back. Whether to take a customer's sessions down is a human's call, not a
# push's (ethos rule 8).

# AUTO-DEPLOY ON GREEN CI — but ONLY the half that cannot take a customer down.
# Ethan's call, 2026-08-12 ("cloud automatically gets every update as it passes
# CI"), reversing the manual-only stance below for the SAFE path and keeping it
# for the dangerous one. Both halves of that reversal matter, so both are here.
#
# What now auto-runs: when the `rust` CI workflow finishes SUCCESSFULLY on main,
# this deploys image + gateway + `docker pull` (the build/deploy jobs). That is
# the "gets every update" the request asks for: the freshly-CI'd binary becomes
# ghcr :latest and the host pulls it.
#
# What STILL cannot auto-run: the container RECREATE (the redeploy job). It stops
# every tmux session in a customer workspace and the rust server does not restore
# them, so whether to take a customer's sessions down stays a human's call (ethos
# rule 8). This is enforced structurally, not by discipline: the redeploy job is
# gated `github.event_name == 'workflow_dispatch'`, and an auto-deploy arrives as
# `workflow_run` — so it is IMPOSSIBLE for a CI-triggered deploy to recreate. A
# running container keeps serving its old image until a human dispatches
# `recreate=yes`; only NEW workspaces start on the fresh image. That is the exact
# line the old manual-only rule protected, drawn one notch tighter so the safe
# side can be automatic.
#
# Why this is safe where the OLD push-trigger was not (the 2026-08-10 incident):
# the old trigger fired on ANY push whose paths touched crates/cloud/** — an
# unreviewed, un-CI'd commit could deploy, and a hand-deployed gateway fix was at
# risk of silent revert by the next unrelated push. This trigger fires only after
# CI is GREEN on main, on the exact commit CI passed (`head_sha`, pinned in every
# checkout + the image tag below), never on a PR (`branches: [main]`), never on a
# red run (the guard job's `if`). "A deploy nobody chose" is now "a deploy CI
# chose", which is the gate the old shape lacked.
#
# Caveat, stated so it is not a surprise: a commit that does NOT trigger `rust`
# (docs, a pure cloud/gateway.py edit, the bash CLI — none match rust.yml's
# `paths`) does not auto-deploy, because there is no CI pass to gate on and no new
# server binary to ship. Deploy those with a manual dispatch. This is the trade
# for gating on CI rather than on push.
#
#   gh workflow run deploy-cloud.yml                    # image + gateway, no recreate
#   gh workflow run deploy-cloud.yml -f recreate=yes    # ALSO stops every session
on:
  workflow_dispatch:
    inputs:
      recreate:
        description: 'Recreate running workspaces onto the new image (STOPS every session in them)'
        required: false
        default: 'no'
        type: choice
        options: ['no', 'yes']
  # Auto-deploy after CI passes on main. Fires on EVERY completion of `rust`
  # (including failures and PR runs); the guard job's `if` keeps only
  # success-on-main, and `branches` pre-filters PR branches out.
  workflow_run:
    workflows: ['rust']
    types: [completed]
    branches: [main]

# Event-SCOPED group, deliberately: with a single shared group, GitHub keeps at
# most ONE waiting run, and each new workflow_run auto-deploy evicts whatever is
# queued — which on 2026-08-22 cancelled two manual recreate dispatches in 30
# minutes (AMUX-3517). The recreate dispatch is the ONLY path that gets new code
# into running containers, so it was being starved precisely when the most code
# was landing. Scoping the group by event_name gives dispatches their own queue
# slot; actual host mutation stays serialized by the flock every SSH step takes
# on /var/lock/amux-deploy.lock (two runs may be green concurrently in Actions,
# but only one touches the host at a time, in whole-step units).
concurrency:
  group: deploy-cloud-${{ github.event_name }}
  cancel-in-progress: false

env:
  CLOUD_HOST: 34.121.177.76
  IMAGE: ghcr.io/mixpeek/amux

jobs:
  # ── 1. The image cannot be a python image again ────────────────────────────
  # This gate exists because the failure it guards is invisible: a python image
  # builds and runs perfectly well, it just runs a server that no longer exists
  # in this repo. Every assertion below is written so it CAN fail — verified by
  # running each one against the deleted python Dockerfile
  # (`git show 792ce1f^:cloud/docker/Dockerfile`), where all four trip.
  guard:
    # The whole cascade (build -> deploy) hangs off this job via `needs`, so
    # this one `if` is the auto-deploy gate: run on a manual dispatch, or on a
    # `rust` CI run that SUCCEEDED. A failed or PR CI run leaves this skipped,
    # which skips build+deploy too (a skipped need does not satisfy `needs`).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      # Pin to the exact commit CI passed, not branch-latest: on a workflow_run
      # event the default ref can drift ahead if another commit landed while CI
      # ran, which would ship an UN-CI'd binary under a green CI's authority.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: The cloud image is a rust build, and nothing here resurrects the python server
        run: |
          fail=0
          if [ -e amux-server.py ]; then
            echo "::error::amux-server.py is back in the repo — the python server was deleted in 792ce1f"
            fail=1
          fi
          if ! grep -qE '^FROM rust:' cloud/docker/Dockerfile; then
            echo "::error::cloud/docker/Dockerfile does not start from a rust image"
            fail=1
          fi
          if grep -qiE '^FROM python' cloud/docker/Dockerfile; then
            echo "::error::cloud/docker/Dockerfile has a python base image"
            fail=1
          fi
          # COMMENT LINES STRIPPED FIRST. Both files explain in prose what they
          # stopped doing, and a bare grep matched that prose — the check failed
          # on a correct tree the first time it was run, which is the cheap
          # version of this mistake. What must not come back is a COPY of the
          # file or a bind mount of it, and those are never comments.
          if grep -vE '^[[:space:]]*#' cloud/docker/Dockerfile cloud/docker/docker-compose.template.yml \
             | grep -q 'amux-server\.py'; then
            echo "::error::the image or compose template still copies/mounts amux-server.py"
            fail=1
          fi
          [ "$fail" = 0 ] && echo "guard: cloud image is rust-only"
          exit "$fail"

      # ── 2. The litestream DR sidecar is version-pinned and runs as root ─────
      # This gate exists because the failure it guards was INVISIBLE: a non-root
      # litestream:latest shipped upstream (2026-07-06), a container recreate
      # picked it up, and the sidecar could no longer WRITE the root:root
      # amux.db — DR replication died fleet-wide with SQLITE_READONLY(8) on
      # _litestream_seq while the root amux server kept writing fine. Nothing
      # surfaced it; it was hand-diagnosed (AMUX-3127). Each check below is
      # written so it CAN fail — verified against the pre-fix template
      # (image: litestream/litestream:latest, no user override).
      - name: litestream DR sidecar is version-pinned and runs as root (AMUX-3127)
        run: |
          tmpl=cloud/docker/docker-compose.template.yml
          # Isolate just the litestream service block (from its key to the next
          # top-level 2-space service key), so a user:/image: elsewhere can't
          # satisfy the check for it.
          block=$(awk '/^  litestream:/{f=1;print;next} /^  [a-z][a-z0-9_-]*:[[:space:]]*$/{f=0} f' "$tmpl")
          fail=0
          if printf '%s\n' "$block" | grep -qE 'image:[[:space:]]*litestream/litestream:latest'; then
            echo "::error::litestream sidecar image is :latest in $tmpl — pin a version (a non-root :latest broke DR, AMUX-3127)"
            fail=1
          fi
          if ! printf '%s\n' "$block" | grep -qE 'image:[[:space:]]*litestream/litestream:[0-9]'; then
            echo "::error::litestream sidecar image is not version-pinned in $tmpl (expected litestream/litestream:<version>)"
            fail=1
          fi
          if ! printf '%s\n' "$block" | grep -qE '^[[:space:]]*user:[[:space:]]*"?0"?[[:space:]]*$'; then
            echo "::error::litestream sidecar must set user: \"0\" to write the root:root amux.db (AMUX-3127)"
            fail=1
          fi
          [ "$fail" = 0 ] && echo "guard: litestream sidecar is version-pinned and runs as root"
          exit "$fail"

  # ── 2. Build + push ────────────────────────────────────────────────────────
  build:
    needs: guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          # Context is the REPO ROOT: the Dockerfile builds the cargo workspace
          # (Cargo.toml, Cargo.lock, crates/) and copies in the `amux` bash CLI.
          context: .
          file: cloud/docker/Dockerfile
          # The cloud host is x86_64. Building only what is deployed keeps this
          # under the runner's time budget; a multi-arch build here would emulate
          # arm64 for nobody. (Local arm64 verification builds natively.)
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.event.workflow_run.head_sha || github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 3. Host: gateway + compose template + pull ─────────────────────────────
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.CLOUD_SSH_KEY }}" > ~/.ssh/amux_cloud
          chmod 600 ~/.ssh/amux_cloud
          ssh-keyscan -H "$CLOUD_HOST" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          # PRINT WHICH KEY WE OFFER. A fingerprint is not secret; the key is, and
          # is never echoed. This exists because "Permission denied (publickey)"
          # names neither the key offered nor the keys accepted, so the failure is
          # undiagnosable from the log alone — ethos rule 4, the instrument could
          # not express the discriminator.
          #
          # It cost a wrong close on 2026-08-10. The CI key was missing from the
          # host's authorized_keys, a key was appended, `ssh -i ~/.ssh/amux_cloud`
          # was verified working, and the deploy was reported fixed. CI kept
          # failing with the identical error, because the key verified by hand was
          # not the key in secrets.CLOUD_SSH_KEY. Verifying from the producer's
          # vantage instead of the consumer's is what made a wrong answer look
          # right: the host now authorizes SHA256:ei2CDWoAPls9LOrHnWBT+qPQYPXwgqEOhbia9G9nI6s,
          # and whether that is the secret's key was exactly the unanswerable part.
          #
          # With this line the fix is mechanical: compare the fingerprint below
          # against `ssh-keygen -lf` over the host's authorized_keys, then either
          # authorize this key or replace the secret. No guessing which end is wrong.
          ssh-keygen -lf ~/.ssh/amux_cloud | sed 's/^/CI offers key: /' || \
            echo "CI offers key: UNREADABLE — secrets.CLOUD_SSH_KEY is empty or not a valid private key"

      - name: Snapshot gateway.py + gateway.env BEFORE any writes (restart only if they change)
        run: |
          # AMUX-2968 residual (amux-cloud, verified): the gateway restart below
          # is a ~2s cloud.amux.io blip, and auto-deploy fires it at a moment
          # nobody picks (any lane's green CI) — a prospect mid-click during a
          # live demo could hit a 502. The fix is not a demo-window gate; it is
          # that a restart is only NEEDED when the gateway's own code or secrets
          # change, and the common auto-deploy (a pure server-binary commit)
          # changes NEITHER. So snapshot both now, compare after the writes, and
          # restart only on a real change. The image pull needs no gateway
          # restart; only gateway.py / gateway.env do.
          H=$(ssh -i ~/.ssh/amux_cloud "root@$CLOUD_HOST" '
            md5sum /opt/amux-cloud/gateway/gateway.py 2>/dev/null | cut -d" " -f1
            md5sum /etc/amux/gateway.env 2>/dev/null | cut -d" " -f1')
          echo "PRE_GW_PY=$(echo "$H" | sed -n 1p)" >> "$GITHUB_ENV"
          echo "PRE_GW_ENV=$(echo "$H" | sed -n 2p)" >> "$GITHUB_ENV"
          echo "pre-deploy: gateway.py md5=$(echo "$H" | sed -n 1p) gateway.env md5=$(echo "$H" | sed -n 2p)"

      - name: Gateway env — admin emails (idempotent, safe on every deploy)
        run: |
          ssh -i ~/.ssh/amux_cloud "root@$CLOUD_HOST" '
            set -e
            touch /etc/amux/gateway.env; chmod 600 /etc/amux/gateway.env
            grep -q "^ADMIN_EMAILS=" /etc/amux/gateway.env || echo "ADMIN_EMAILS=ethan@mixpeek.com,esteininger21@gmail.com" >> /etc/amux/gateway.env
            grep "^ADMIN_EMAILS=" /etc/amux/gateway.env | grep -q "hello@amux.io" || sed -i "s/^ADMIN_EMAILS=/ADMIN_EMAILS=hello@amux.io,/" /etc/amux/gateway.env
            grep "^ADMIN_EMAILS=" /etc/amux/gateway.env | grep -q "qa-godmode@amux.io" || sed -i "s/^ADMIN_EMAILS=/ADMIN_EMAILS=qa-godmode@amux.io,/" /etc/amux/gateway.env
            echo "admin emails now: $(grep ^ADMIN_EMAILS= /etc/amux/gateway.env)"
            echo "container hop (unchanged by this step): $(grep ^CONTAINER_SCHEME= /etc/amux/gateway.env || echo "<unset — http>")"'

      # ---------------------------------------------------------------------
      # THE HOP SCHEME IS HALF OF A CUTOVER, SO IT IS GATED LIKE THE OTHER HALF.
      #
      # AMUX-2809. This used to run on EVERY deploy with no `if:` while the
      # container recreate below is gated to `workflow_dispatch && recreate ==
      # 'yes'`, and line ~264 passes `--no-recreate ON PURPOSE`. So the two
      # halves of one cutover were independently gated and only one of them was
      # unconditional. The step's own comment claimed "the gateway and the image
      # cross over in the same deploy" — they did not: the image only reaches a
      # container on recreate=yes.
      #
      # Worst path was the automatic one. `paths:` includes `crates/**`,
      # `Cargo.toml`, `Cargo.lock` and `cloud/**`, so a routine push — by any
      # lane, touching any of those — fired this workflow, skipped the recreate
      # by its own condition, and flipped the scheme anyway. Nobody chose that;
      # the trigger did.
      #
      # Measured on the live host 2026-08-10, a control pair on the same port of
      # a running amux-user container:
      #     docker inspect .Config.Cmd -> [python amux-server.py 8822 --no-tls]
      #     http://127.0.0.1:9059/api/health  -> 404  (answered — plain HTTP)
      #     https://127.0.0.1:9059/api/health -> 000  (connection failed)
      # Pointing the gateway at https:// against those breaks every workspace
      # hop for all 6 live customers.
      #
      # Not-setting it is the safe state: the gateway defaults to http and logs
      # "container hop: http:// (cert verification n/a)".
      #
      # ---- 2026-08-11: THE FLIP MOVED OUT OF THIS JOB ENTIRELY --------------
      # Gating it here was necessary and still not sufficient, because the
      # ORDER was inverted: this job writes the scheme, and `redeploy` (which
      # `needs: [build, deploy]`) is what makes the containers rust. So the
      # gateway was pointed at https BEFORE anything answered https, and the
      # window between the two jobs was a guaranteed outage rather than a risk.
      #
      # Worse, a failure inside that window was unrecoverable by the workflow.
      # When the verify step below failed on a deploy that was otherwise fine
      # (see the race it hit, now fixed), `redeploy` never ran — so the scheme
      # stayed https and the containers stayed python. Measured on a live
      # workspace port during that run:
      #     https://127.0.0.1:9056/api/sessions -> 000
      #     http://127.0.0.1:9056/api/sessions  -> 200
      # Every workspace hop was down until a human unset the scheme by hand.
      # A failed deploy must leave the system UNCHANGED; this one left it in
      # precisely the half-flipped state the gating above was written to
      # prevent. The gate stopped a PUSH from causing it and did not stop a
      # legitimate dispatch from causing it.
      #
      # The flip now lives in `redeploy`, immediately AFTER the recreate loop
      # has proved every container answers as rust, and it restores the previous
      # value on any failure. Both halves of the cutover are in the job that
      # owns them, in the only order that is safe, and a failed run ends where
      # it started. Reported by amux-cloud, who restored prod by hand.
      # ---------------------------------------------------------------------

      - name: Sync gateway secrets from repo secrets (host-only, never in a container)
        run: |
          # Secrets live in GitHub (encrypted) and land in /etc/amux/gateway.env on
          # the HOST. The gateway process reads them; user containers never receive
          # them. Values are piped over stdin so they never appear in a command line
          # or in the workflow log.
          sync_secret() {
            NAME="$1"; VAL="$2"
            if [ -z "$VAL" ]; then echo "$NAME: not set in repo secrets — skipped"; return; fi
            printf '%s' "$VAL" | ssh -i ~/.ssh/amux_cloud "root@$CLOUD_HOST" \
              "read -r V; N='$NAME'; touch /etc/amux/gateway.env; chmod 600 /etc/amux/gateway.env;
               if grep -q \"^\$N=\" /etc/amux/gateway.env; then
                 grep -v \"^\$N=\" /etc/amux/gateway.env > /etc/amux/.ge.tmp
                 mv /etc/amux/.ge.tmp /etc/amux/gateway.env
                 chmod 600 /etc/amux/gateway.env
               fi
               printf '%s=%s\n' \"\$N\" \"\$V\" >> /etc/amux/gateway.env
               echo \"\$N updated (\${#V} chars, value not shown)\""
          }
          sync_secret STRIPE_SECRET_KEY "${{ secrets.STRIPE_SECRET_KEY }}"
          sync_secret ANTHROPIC_API_KEY "${{ secrets.ANTHROPIC_API_KEY }}"
          sync_secret STRIPE_PLATFORM_FEE_PRICE_ID "${{ secrets.STRIPE_PLATFORM_FEE_PRICE_ID }}"
          sync_secret STRIPE_PLATFORM_PRICE_ID "${{ secrets.STRIPE_PLATFORM_PRICE_ID }}"

      - name: Deploy gateway.py + compose template + litestream config
        run: |
          rsync --inplace -e "ssh -i ~/.ssh/amux_cloud" cloud/gateway/gateway.py \
            "root@$CLOUD_HOST:/opt/amux-cloud/gateway/gateway.py"
          rsync -e "ssh -i ~/.ssh/amux_cloud" cloud/docker/docker-compose.template.yml \
            "root@$CLOUD_HOST:/opt/amux-cloud/docker/docker-compose.template.yml"
          rsync -e "ssh -i ~/.ssh/amux_cloud" cloud/litestream/litestream.yml \
            "root@$CLOUD_HOST:/opt/amux-cloud/litestream/litestream.yml"
          # Restart the gateway ONLY if its code or secrets actually changed
          # (AMUX-2968 residual). compose.template + litestream are read by
          # docker/litestream, not the gateway process, so they never justify a
          # restart. A pure server-binary auto-deploy leaves both hashes equal →
          # no restart → no cloud.amux.io blip, which is the demo-safety the
          # residual asked for. A real gateway.py or secret change still restarts
          # (the blip then is a deploy someone meant to make).
          NOW=$(ssh -i ~/.ssh/amux_cloud "root@$CLOUD_HOST" '
            md5sum /opt/amux-cloud/gateway/gateway.py 2>/dev/null | cut -d" " -f1
            md5sum /etc/amux/gateway.env 2>/dev/null | cut -d" " -f1')
          NPY=$(echo "$NOW" | sed -n 1p); NENV=$(echo "$NOW" | sed -n 2p)
          if [ "$NPY" != "${PRE_GW_PY:-}" ] || [ "$NENV" != "${PRE_GW_ENV:-}" ]; then
            echo "gateway changed (py ${PRE_GW_PY:-none}->$NPY, env ${PRE_GW_ENV:-none}->$NENV) — restarting (expect a ~2s blip)"
            ssh -i ~/.ssh/amux_cloud "root@$CLOUD_HOST" \
              'pip3 install -q stripe 2>/dev/null; systemctl restart amux-gateway && sleep 2 && systemctl is-active amux-gateway'
          else
            echo "gateway.py + gateway.env UNCHANGED — skipping restart, NO proxy blip; verifying still active"
            ssh -i ~/.ssh/amux_cloud "root@$CLOUD_HOST" 'systemctl is-active amux-gateway'
          fi

      # GATED WITH THE WRITER IT VERIFIES, and that pairing is the point.
      #
      # Gating the flip (AMUX-2809) without gating its verifier would have made
      # every ordinary push-deploy fail here: the gateway is deliberately on
      # http while the containers are still python, so a step asserting https
      # unconditionally now contradicts the step that decides the scheme. That
      # is the "which signal will people reach for next" trap — killing a bad
      # write and leaving its assertion behind just relocates the wrong answer,
      # and a red deploy that is red on purpose teaches everyone to ignore it.
      #
      # So: this asserts the hop ONLY on the run that set it. On every other
      # deploy there is nothing to verify, because nothing changed the scheme.
      #
      # ---- 2026-08-11: MOVED, with the flip it verifies ---------------------
      # It has to travel with its writer — that pairing is the whole argument
      # above, and it is just as true in the other direction. The assertion now
      # sits inside the flip step in `redeploy`, where it can also roll back.
      # -----------------------------------------------------------------------

      # The half worth keeping on EVERY deploy: that the gateway came back at
      # all. It is scheme-agnostic on purpose — it must pass both before and
      # after the cutover, or it becomes another assertion that has to be
      # remembered and re-gated the next time the scheme moves.
      - name: Gateway restarted and is serving
        run: |
          ssh -i ~/.ssh/amux_cloud "root@$CLOUD_HOST" '
            systemctl is-active --quiet amux-gateway || { echo "::error::amux-gateway is not active"; exit 1; }
            line=$(grep -a "container hop:" /var/log/amux-gateway.log | tail -1)
            echo "gateway is active; hop currently: ${line:-<not yet logged>}"'

      - name: Pull the new image and (re)generate per-workspace compose files
        run: |
          ssh -i ~/.ssh/amux_cloud "root@$CLOUD_HOST" 'flock -w 900 /var/lock/amux-deploy.lock bash -s' << 'ENDSSH'
            set -u
            source /etc/amux/gateway.env
            R2_ENDPOINT="https://${CF_ACCOUNT_ID}.r2.cloudflarestorage.com"
            TEMPLATE=/opt/amux-cloud/docker/docker-compose.template.yml

            docker image prune -af >/dev/null 2>&1 || true
            docker pull ghcr.io/mixpeek/amux:latest
            WANT=$(docker image inspect -f '{{.Id}}' ghcr.io/mixpeek/amux:latest)
            echo "target image: $WANT"

            # The glob has silently matched nothing before, and an empty glob
            # leaves `user_dir` as the literal pattern — indistinguishable from
            # "there were no workspaces" unless the preflight says so out loud.
            echo "== deploy loop preflight =="
            echo "  template exists: $([ -f "$TEMPLATE" ] && echo yes || echo NO)"
            _n=$(ls -d /var/amux/users/*/ 2>/dev/null | wc -l | tr -d ' ')
            echo "  /var/amux/users/*/ matched: ${_n} dir(s)"
            if [ "${_n}" = "0" ]; then
              echo "  LOOP WILL DO NOTHING — what actually exists under /var/amux:"
              ls -la /var/amux/ 2>&1 | head -10 | sed 's/^/    /'
              exit 0
            fi

            stale=""
            for user_dir in /var/amux/users/*/; do
              user_id=$(basename "$user_dir")
              compose_file="$user_dir/docker-compose.yml"
              # This loop is DIRECTORY-driven, not DB-driven: a workspace dir left
              # behind by an incomplete deletion (delete removed the gateway.db row
              # and the docker volume but not /var/amux/users/<id>) gets its
              # container RESURRECTED here, silently, even though the org no longer
              # exists to any user. That happened on 2026-08-18: a recreate=yes run
              # brought back 6 orgs the mass-delete had removed (AC-373), because it
              # never removed their dirs. Make the resurrection self-announce so a
              # deploy-log sweep catches the next one instead of a human noticing a
              # container count that does not match the org count. NOTE: the host has
              # NO sqlite3 CLI (only python3), so query via the sqlite3 module — an
              # earlier `sqlite3 …` version of this check was silently inert.
              if [ -f /var/amux/gateway.db ]; then
                _hasrow=$(python3 -c "import sqlite3; print('1' if sqlite3.connect('/var/amux/gateway.db').execute(\"SELECT 1 FROM orgs WHERE id=? UNION SELECT 1 FROM users WHERE id=? UNION SELECT 1 FROM orgs WHERE owner_id=? UNION SELECT 1 FROM org_memberships WHERE user_id=? LIMIT 1\", ('${user_id}','${user_id}','${user_id}','${user_id}')).fetchone() else '')" 2>/dev/null)
                if [ -z "$_hasrow" ]; then
                  # SKIP, not just warn. The gateway resolves every workspace from
                  # the DB, so a dir with NO row is unreachable by any user — a
                  # leftover from an incomplete deletion, not a real workspace. A
                  # legit new signup always has its org/user row committed BEFORE
                  # its dir is provisioned, so it is never skipped here. Not
                  # skipping is exactly how a recreate=yes run resurrected 6 deleted
                  # orgs on 2026-08-18 (AC-373). We do NOT rm the dir from CI (that
                  # is an owner-authorised delete, ethos rule 8); we refuse to bring
                  # it back and make the refusal loud.
                  echo "::warning::orphaned workspace ${user_id}: /var/amux/users/${user_id} has NO gateway.db row — SKIPPING (refusing to resurrect a deleted env). Remove the dir to silence: rm -rf /var/amux/users/${user_id}"
                  continue
                fi
              fi
              # Search the WHOLE file for the host port bound to :8822. A
              # `grep -A1 ports:` parse broke silently once when a comment moved
              # in above the mapping, and skipped all 19 workspaces while the
              # step still exited 0.
              port=$(grep -oP "[0-9]{4,}(?=:8822)" "$compose_file" 2>/dev/null | head -1)
              if [ -z "$port" ]; then
                echo "  SKIP ${user_id}: no port parsed from ${compose_file}"
                continue
              fi
              sed "s/\${USER_ID}/${user_id}/g;
                   s/\${USER_PORT}/${port}/g;
                   s/\${CF_ACCOUNT_ID}/${CF_ACCOUNT_ID}/g;
                   s|\${R2_ENDPOINT}|${R2_ENDPOINT}|g;
                   s/\${R2_ACCESS_KEY}/${R2_ACCESS_KEY}/g;
                   s/\${R2_SECRET_KEY}/${R2_SECRET_KEY}/g;
                   s/\${POSTHOG_KEY}/${POSTHOG_KEY:-}/g;
                   s|\${POSTHOG_HOST}|${POSTHOG_HOST:-https://us.i.posthog.com}|g" \
                "$TEMPLATE" > "$compose_file"

              # --no-recreate ON PURPOSE. A recreate stops every tmux session in
              # this customer's workspace and nothing restores them (the rust
              # server has no AMUX_AUTOSTART_SESSIONS). New/stopped workspaces
              # come up on the new image; running ones keep serving until a human
              # runs this workflow with recreate=yes.
              ( cd "$user_dir" && docker compose up -d --no-recreate 2>&1 | grep -v '^#' | tail -3 )

              have=$(docker inspect -f '{{.Image}}' "amux-user-${user_id}" 2>/dev/null || echo none)
              if [ "$have" != "$WANT" ]; then
                stale="${stale} ${user_id}"
                echo "  ${user_id}: STILL ON THE OLD IMAGE (running ${have:0:19}…)"
              else
                echo "  ${user_id}: on the new image"
              fi
            done

            echo ""
            if [ -n "$stale" ]; then
              echo "WORKSPACES NOT YET ON THIS BUILD:${stale}"
              echo "They are running the previous server. To move them:"
              echo "  gh workflow run deploy-cloud.yml -f recreate=yes"
              echo "…which STOPS every session in each one. That is a human's call."
            else
              echo "every workspace is on the new image"
            fi
          ENDSSH

  # ── 4. Recreate — explicit, never automatic ────────────────────────────────
  redeploy:
    needs: [build, deploy]
    if: github.event_name == 'workflow_dispatch' && inputs.recreate == 'yes'
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.CLOUD_SSH_KEY }}" > ~/.ssh/amux_cloud
          chmod 600 ~/.ssh/amux_cloud
          ssh-keyscan -H "$CLOUD_HOST" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          # PRINT WHICH KEY WE OFFER. A fingerprint is not secret; the key is, and
          # is never echoed. This exists because "Permission denied (publickey)"
          # names neither the key offered nor the keys accepted, so the failure is
          # undiagnosable from the log alone — ethos rule 4, the instrument could
          # not express the discriminator.
          #
          # It cost a wrong close on 2026-08-10. The CI key was missing from the
          # host's authorized_keys, a key was appended, `ssh -i ~/.ssh/amux_cloud`
          # was verified working, and the deploy was reported fixed. CI kept
          # failing with the identical error, because the key verified by hand was
          # not the key in secrets.CLOUD_SSH_KEY. Verifying from the producer's
          # vantage instead of the consumer's is what made a wrong answer look
          # right: the host now authorizes SHA256:ei2CDWoAPls9LOrHnWBT+qPQYPXwgqEOhbia9G9nI6s,
          # and whether that is the secret's key was exactly the unanswerable part.
          #
          # With this line the fix is mechanical: compare the fingerprint below
          # against `ssh-keygen -lf` over the host's authorized_keys, then either
          # authorize this key or replace the secret. No guessing which end is wrong.
          ssh-keygen -lf ~/.ssh/amux_cloud | sed 's/^/CI offers key: /' || \
            echo "CI offers key: UNREADABLE — secrets.CLOUD_SSH_KEY is empty or not a valid private key"

      - name: Recreate running workspaces and prove the new server answers
        run: |
          ssh -i ~/.ssh/amux_cloud "root@$CLOUD_HOST" 'flock -w 900 /var/lock/amux-deploy.lock bash -s' << 'ENDSSH'
            set -u
            WANT=$(docker image inspect -f '{{.Id}}' ghcr.io/mixpeek/amux:latest)
            bad=0
            for d in /var/amux/users/*/; do
              id=$(basename "$d")
              docker ps --format '{{.Names}}' | grep -qx "amux-user-${id}" || continue
              echo "recreating $id"
              ( cd "$d" && docker compose up -d --force-recreate 2>&1 | tail -2 )
            done
            echo ""
            echo "verifying each workspace serves the RUST server:"
            for d in /var/amux/users/*/; do
              id=$(basename "$d")
              c="amux-user-${id}"
              docker ps --format '{{.Names}}' | grep -qx "$c" || continue
              have=$(docker inspect -f '{{.Image}}' "$c")
              port=$(grep -oP "[0-9]{4,}(?=:8822)" "$d/docker-compose.yml" | head -1)
              # `server` discriminates rust from python; `build` is the content
              # hash of the running binary. A 200 alone would not tell them apart.
              h=$(curl -fsk --max-time 5 "https://127.0.0.1:${port}/health" 2>/dev/null || echo '')
              srv=$(printf '%s' "$h" | grep -o '"server":"[^"]*"' || echo '"server":<none>')
              if [ "$have" = "$WANT" ] && printf '%s' "$srv" | grep -q 'amux-rust'; then
                echo "  $c: OK  $srv"
              else
                echo "  $c: FAILED — image=$([ "$have" = "$WANT" ] && echo new || echo old) health=${h:-<no answer>}"
                bad=1
              fi
            done
            # A collided recreate is INVISIBLE to both loops above: they iterate
            # `docker ps` (running only), and the collision's signature is the old
            # container killed and the replacement stuck in Created under a
            # hash-prefixed name — so the env drops out of the running list and the
            # job stays green. That happened on 2026-08-22 (org_02699…: Exited(137)
            # + stray Created, deploy reported SUCCESS, env down until a human
            # counted containers). Assert the absence directly: after a recreate,
            # NO amux-user container may exist in a non-running state.
            wedged=$(docker ps -a --filter 'name=amux-user' --format '{{.Names}}: {{.State}}' | grep -v ': running$' || true)
            if [ -n "$wedged" ]; then
              echo "RECREATE LEFT WEDGED CONTAINERS (exists but not running):"
              echo "$wedged" | sed 's/^/  /'
              bad=1
            fi
            exit "$bad"
          ENDSSH

      # THE OTHER HALF OF THE CUTOVER — and it runs here, last, on purpose.
      #
      # The containers above have just PROVEN they answer https as rust. Only
      # now is it true that pointing the gateway at https:// is safe. The long
      # comment in the `deploy` job records what this ordering cost when it was
      # inverted: prod half-flipped, every workspace hop down, restored by hand.
      #
      # Two properties this step must have, both learned the hard way:
      #
      #   ATOMIC. Any failure restores the previous CONTAINER_SCHEME and
      #   restarts, so a red run ends where it started. `trap` fires on the
      #   error path of every command under `set -e`, including the verify.
      #
      #   RACE-FREE VERIFY. The old check grepped `tail -1` of the log
      #   immediately after `systemctl restart` and read the PREVIOUS startup
      #   line, because the new one had not flushed yet — failing a deploy that
      #   was fine, which is what triggered the outage. Counting the hop lines
      #   BEFORE the restart and waiting for the count to grow is what makes
      #   "the line I am reading is from THIS restart" a fact rather than a
      #   hope. Waiting for a newer line is the fix; dropping the assertion is
      #   not (a scheme-agnostic check here cannot fail, ethos rule 7).
      - name: Flip the gateway to the https hop (atomic — restores on any failure)
        run: |
          ssh -i ~/.ssh/amux_cloud "root@$CLOUD_HOST" 'flock -w 900 /var/lock/amux-deploy.lock bash -s' << 'ENDSSH'
            set -eu
            LOG=/var/log/amux-gateway.log
            ENV=/etc/amux/gateway.env
            touch "$ENV"; chmod 600 "$ENV"

            PREV=$(grep "^CONTAINER_SCHEME=" "$ENV" || true)
            echo "previous hop setting: ${PREV:-<unset — http>}"

            write_scheme() {   # $1 = full line, or empty to unset (= http default)
              grep -v "^CONTAINER_SCHEME=" "$ENV" > /etc/amux/.ge.tmp || true
              # `if`, not `[ -n "$1" ] && echo`: the latter returns 1 when the
              # argument is empty, which is precisely the rollback-to-unset
              # path — the real pre-cutover state — and leaning on set -e's
              # exemption rules there is not worth the ambiguity.
              if [ -n "$1" ]; then echo "$1" >> /etc/amux/.ge.tmp; fi
              mv /etc/amux/.ge.tmp "$ENV"; chmod 600 "$ENV"
            }
            rollback() {
              echo "::error::https flip failed — restoring ${PREV:-<unset — http>} and restarting"
              write_scheme "$PREV"
              systemctl restart amux-gateway || true
              sleep 2
              systemctl is-active amux-gateway || echo "::error::gateway did not come back after rollback"
            }
            # EXIT, not ERR, and it is not a style preference: an ERR trap does
            # NOT fire on an explicit `exit 1`, so every hand-written failure
            # path below — the 30s timeout, the wrong-scheme case, the
            # is-active check — would have skipped the rollback and left prod
            # in exactly the half-flipped state this step exists to prevent.
            # A rollback that cannot fire on the failures it was written for is
            # the purest form of ethos rule 7.
            SUCCESS=0
            trap '[ "$SUCCESS" = 1 ] || rollback' EXIT

            # Count BEFORE the restart — this is the race fix.
            # `grep -c` PRINTS the count and exits 1 when it is zero, so the
            # obvious `|| echo 0` appends a second line and yields "0\n0",
            # which then breaks `-gt`. Assign, then correct on failure.
            BEFORE=$(grep -ac "container hop:" "$LOG" 2>/dev/null) || BEFORE=0

            write_scheme "CONTAINER_SCHEME=https"
            systemctl restart amux-gateway

            # Wait for a hop line that did not exist before this restart.
            ok=0
            for _ in $(seq 1 30); do
              now=$(grep -ac "container hop:" "$LOG" 2>/dev/null) || now=0
              if [ "$now" -gt "$BEFORE" ]; then ok=1; break; fi
              sleep 1
            done
            [ "$ok" = 1 ] || { echo "::error::no new 'container hop:' line within 30s of restart (before=$BEFORE)"; exit 1; }

            line=$(grep -a "container hop:" "$LOG" | tail -1)
            echo "gateway says: $line"
            case "$line" in
              *"container hop: https://"*) ;;
              *) echo "::error::gateway restarted but is not on the https container hop"; exit 1 ;;
            esac

            systemctl is-active --quiet amux-gateway || { echo "::error::amux-gateway is not active"; exit 1; }
            SUCCESS=1
            echo "https hop live, containers on rust — cutover complete"
          ENDSSH
