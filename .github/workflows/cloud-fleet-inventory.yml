name: Cloud fleet inventory (what every workspace actually contains)

# One view of every provisioned workspace: which org, which sessions tmux really
# has, how much scrollback each session carries, and how many board items and
# files exist. Answers "does this POC environment have real work in it?" from
# ground truth rather than from the provisioning script's own report.

on:
  workflow_dispatch:

env:
  CLOUD_HOST: ${{ vars.CLOUD_HOST || '34.121.177.76' }}

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.CLOUD_SSH_KEY }}" > ~/.ssh/amux_cloud
          chmod 600 ~/.ssh/amux_cloud
          ssh-keyscan -H "$CLOUD_HOST" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Inventory every workspace
        run: |
          ssh -i ~/.ssh/amux_cloud root@"$CLOUD_HOST" 'bash -s' <<'ENDSSH'
            for C in $(docker ps --filter name=amux-user- --format '{{.Names}}' | sort); do
              ORG="${C#amux-user-}"
              echo "=============================================================="
              echo "container: $C"
              docker inspect "$C" --format '  up={{.State.Running}} restarts={{.RestartCount}} oom={{.State.OOMKilled}}' 2>/dev/null
              echo "  -- tmux sessions (ground truth) + scrollback lines each:"
              docker exec "$C" sh -lc '
                tmux list-sessions -F "#{session_name}" 2>/dev/null | while read s; do
                  n=$(tmux capture-pane -p -S - -t "$s" 2>/dev/null | grep -c .)
                  printf "     %-42s %6s non-blank lines\n" "$s" "$n"
                done
                [ -z "$(tmux list-sessions 2>/dev/null)" ] && echo "     (none)"
              ' 2>&1
              echo "  -- board items by status:"
              docker exec "$C" sh -lc 'curl -s localhost:8822/api/board' 2>/dev/null \
                | tr ',' '\n' | grep -o '"status": *"[a-z]*"' | sort | uniq -c \
                | sed 's/^/     /' || echo "     EMPTY"
              # Workspace files = what the PROSPECT would see. Every dot-directory
              # is excluded, not a hand-listed few: the old filter named .amux,
              # .cache, .config and .npm, so /root/.claude and /root/.codex
              # boilerplate filled the head -12 and a seeded workspace reported as
              # "boilerplate only" while its context docs sat right there in
              # /root/demo. The count is printed BEFORE the truncation so a long
              # list can never read as a short one.
              echo "  -- workspace files (non-hidden, /root, depth<=3):"
              docker exec "$C" sh -lc 'n=$(find /root -maxdepth 3 -type f -not -path "*/.*" 2>/dev/null | wc -l);
                 echo "     ($n file(s) total; showing up to 20)";
                 find /root -maxdepth 3 -type f -not -path "*/.*" 2>/dev/null | head -20' 2>&1 | sed 's/^/     /'
            done
          ENDSSH
