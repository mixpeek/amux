name: Cloud exec check (tmux ground truth)

# Reads what is ACTUALLY inside a user container — tmux sessions and session
# env files — rather than trusting the gateway API. Used when the UI and the
# API disagree about what exists.

on:
  workflow_dispatch:
    inputs:
      org:
        description: 'org id (container amux-user-<org>)'
        required: true

env:
  CLOUD_HOST: ${{ vars.CLOUD_HOST || '34.121.177.76' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.CLOUD_SSH_KEY }}" > ~/.ssh/amux_cloud
          chmod 600 ~/.ssh/amux_cloud
          ssh-keyscan -H "$CLOUD_HOST" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Inspect container
        env:
          ORG: ${{ inputs.org }}
        run: |
          ssh -i ~/.ssh/amux_cloud root@"$CLOUD_HOST" "ORG='$ORG' bash -s" <<'ENDSSH'
            C="amux-user-${ORG}"
            echo "container: $C"
            docker ps --filter "name=$C" --format '  id={{.ID}} status={{.Status}} image={{.Image}}'
            # Why a workspace went away matters as much as that it did: an
            # OOM kill and a crash look identical from inside the container,
            # and "server unreachable" was being read as "nothing persisted".
            docker inspect "$C" --format '  restarts={{.RestartCount}} oom_killed={{.State.OOMKilled}} exit={{.State.ExitCode}}' 2>/dev/null
            echo "  host memory:"
            free -m 2>/dev/null | sed 's/^/    /'
            echo "  recent host OOM kills:"
            dmesg -T 2>/dev/null | grep -i "killed process\|out of memory" | tail -5 | sed 's/^/    /' || echo "    (dmesg unavailable)"
            echo
            echo "=== tmux list-sessions (ground truth) ==="
            docker exec "$C" tmux list-sessions 2>&1 | sed 's/^/  /'
            echo
            echo "=== ~/.amux/sessions/*.env (what amux thinks exists) ==="
            docker exec "$C" sh -lc 'ls -1 /root/.amux/sessions/ 2>&1' | sed 's/^/  /'
            echo
            echo "=== workspace files ==="
            docker exec "$C" sh -lc 'ls -la /root/wexus 2>&1 | head -20' | sed 's/^/  /'
            echo
            echo "=== agent output dir ==="
            docker exec "$C" sh -lc 'ls -R /root/wexus/docs/results 2>&1 | head -25' | sed 's/^/  /'
            echo
            echo "=== browser profiles (ground truth) ==="
            docker exec "$C" sh -lc 'ls -la /root/.amux/playwright-auth/profiles/ 2>&1 | head -20' | sed 's/^/  /'
            echo "  --- launcher logs ---"
            # NOT truncated: a global `head` here once cut the dump off before
            # the one log that mattered, and a matching byte count on two files
            # got read as "same failure" when neither had actually been shown.
            docker exec "$C" sh -lc 'for f in /root/.amux/playwright-auth/profiles/*.log; do echo "== $f"; tail -25 "$f"; done 2>&1' | sed 's/^/  /'
            echo "  --- chrome present? ---"
            docker exec "$C" sh -lc 'ls /root/.cache/ms-playwright/ 2>&1; which google-chrome google-chrome-stable 2>&1' | sed 's/^/  /'
            echo
            echo "=== what the container's own API returns ==="
            docker exec "$C" sh -lc 'curl -s localhost:8822/api/sessions | head -c 600' | sed 's/^/  /'
          ENDSSH
