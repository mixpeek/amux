name: Cloud recover (diagnose first, then restart named containers)

# Built during the 2026-08-02 incident (AC-162): dockerd wedged, `docker ps`
# timed out for ~1h, and containers that lived through it came back "Up
# (unhealthy)" — live processes, dead servers inside, every per-org route 503.
# `docker compose up -d --no-recreate` does NOT fix that: they are Up, so it
# correctly leaves them alone. A restart is the remedy.
#
# ORDER MATTERS AND IS DELIBERATE: this pulls the evidence BEFORE it restarts
# anything. journalctl and the healthcheck output are the only record of WHY the
# daemon wedged, and a restart rolls the container logs. Diagnose, then act —
# the reverse loses the cause and guarantees a repeat nobody can explain.
#
# Restart is OPT-IN per container: `orgs` is an explicit comma-separated list,
# never "all". These are other people's running workspaces; restarting one
# without its owner asking is not a call CI should make on its own.

on:
  workflow_dispatch:
    inputs:
      orgs:
        description: 'comma-separated org ids to RESTART (blank = diagnose only)'
        required: false
        default: ''
      journal_lines:
        description: 'lines of docker journal to pull'
        required: false
        default: '120'
      recreate_watchdogs:
        description: 'recreate ALL watchdog sidecars so they pick up watchdog.py + on-failure:5 (true/false)'
        required: false
        default: 'false'

env:
  CLOUD_HOST: ${{ vars.CLOUD_HOST || '34.121.177.76' }}

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.CLOUD_SSH_KEY }}" > ~/.ssh/amux_cloud
          chmod 600 ~/.ssh/amux_cloud
          # ssh-keyscan must NOT be able to fail this job. When the host wedges,
          # the kernel still completes the TCP handshake while sshd is too
          # starved to send its banner — so `nc` to port 22 succeeds and keyscan
          # times out. Under `bash -e` that killed every diagnostic run at the
          # first step, which meant the tool built to investigate an outage was
          # unusable during exactly that outage.
          # Best-effort keyscan, longer patience, and accept-new as the fallback:
          # a slow-but-alive sshd now gets us in instead of failing the job.
          timeout 45 ssh-keyscan -T 30 -H "$CLOUD_HOST" >> ~/.ssh/known_hosts 2>/dev/null \
            && echo "keyscan ok" || echo "keyscan failed/timed out — continuing with accept-new"
          chmod 644 ~/.ssh/known_hosts 2>/dev/null || true
          # UNQUOTED heredoc on purpose: $CLOUD_HOST must expand here. Keep
          # this block free of any other $ or backtick.
          cat >> ~/.ssh/config <<EOF
          Host $CLOUD_HOST
            StrictHostKeyChecking accept-new
            ConnectTimeout 30
            ServerAliveInterval 10
            ServerAliveCountMax 6
          EOF
          chmod 600 ~/.ssh/config

      - name: Diagnose BEFORE touching anything
        env:
          JLINES: ${{ inputs.journal_lines }}
        run: |
          ssh -i ~/.ssh/amux_cloud root@"$CLOUD_HOST" "JLINES='$JLINES' bash -s" <<'ENDSSH'
            echo "=== disk (the leading hypothesis for a wedged daemon) ==="
            df -h 2>&1 | sed 's/^/  /'
            echo
            echo "=== docker's own storage accounting ==="
            timeout 30 docker system df 2>&1 | sed 's/^/  /' || echo "  docker system df TIMED OUT (daemon still degraded)"
            echo
            echo "=== dockerd journal — WHY it wedged. This is the record that a restart destroys. ==="
            journalctl -u docker --no-pager -n "${JLINES:-120}" 2>&1 | sed 's/^/  /' || echo "  (journalctl unavailable)"
            echo
            echo "=== kernel: OOM kills / IO errors in the window ==="
            (journalctl -k --no-pager --since '6 hours ago' 2>/dev/null | grep -iE 'oom|killed process|I/O error|blocked for more than' | tail -20 | sed 's/^/  /') \
              || echo "  (none found or journalctl -k unavailable)"
            echo
            echo "=== container health right now ==="
            timeout 30 docker ps --format '{{.Names}}\t{{.Status}}' 2>&1 | sed 's/^/  /' || echo "  docker ps TIMED OUT"
            echo
            echo "=== why the unhealthy ones are unhealthy (last healthcheck output) ==="
            for c in $(timeout 20 docker ps --filter health=unhealthy --format '{{.Names}}' 2>/dev/null | head -6); do
              echo "  -- $c"
              docker inspect "$c" --format '{{range .State.Health.Log}}{{.Output}}{{end}}' 2>&1 | tail -3 | sed 's/^/     /'
            done
            echo
            # The crashloopers are the actual cause: a sidecar exiting 1 under
            # `unless-stopped` with no backoff restarted 4318 times and saturated
            # dockerd. These are in state Restarting, NOT unhealthy, so the loop
            # above never sees them — and their exit reason lives only here.
            echo "=== CRASHLOOPERS: restart counts and why they exit ==="
            for c in $(timeout 20 docker ps -a --filter status=restarting --format '{{.Names}}' 2>/dev/null | head -6); do
              n=$(docker inspect "$c" --format '{{.RestartCount}}' 2>/dev/null)
              code=$(docker inspect "$c" --format '{{.State.ExitCode}}' 2>/dev/null)
              echo "  -- $c  restartCount=$n  lastExit=$code"
              docker logs --tail 25 "$c" 2>&1 | sed 's/^/     /'
            done
          ENDSSH

      - name: Restart ONLY the named containers
        if: ${{ inputs.orgs != '' }}
        env:
          ORGS: ${{ inputs.orgs }}
        run: |
          ssh -i ~/.ssh/amux_cloud root@"$CLOUD_HOST" "ORGS='$ORGS' bash -s" <<'ENDSSH'
            for org in $(echo "$ORGS" | tr ',' ' '); do
              c="amux-user-${org}"
              echo "=== restarting $c ==="
              before=$(docker inspect "$c" --format '{{.State.Status}}/{{.State.Health.Status}}' 2>&1)
              echo "  before: $before"
              if timeout 90 docker restart "$c" >/dev/null 2>&1; then
                sleep 12
                after=$(docker inspect "$c" --format '{{.State.Status}}/{{.State.Health.Status}}' 2>&1)
                echo "  after:  $after"
              else
                echo "  RESTART FAILED or timed out for $c"
              fi
            done
            echo
            echo "=== settling 30s, then health across the fleet ==="
            sleep 30
            docker ps --format '{{.Names}}\t{{.Status}}' 2>&1 | sed 's/^/  /'
          ENDSSH

      - name: Recreate watchdog sidecars (pick up the file + capped restart policy)
        if: ${{ inputs.recreate_watchdogs == 'true' }}
        run: |
          ssh -i ~/.ssh/amux_cloud root@"$CLOUD_HOST" 'bash -s' <<'ENDSSH'
            # A container's bind mounts AND restart policy are fixed at creation.
            # Shipping watchdog.py and changing the template does nothing for
            # sidecars already running with the old empty-directory mount and
            # `unless-stopped` — they keep crashlooping and keep endangering the
            # daemon. Only a recreate picks either up.
            for d in /var/amux/users/*/; do
              u=$(basename "$d")
              [ -f "$d/docker-compose.yml" ] || continue
              printf '%-46s ' "$u"
              if (cd "$d" && timeout 120 docker compose up -d --force-recreate watchdog >/dev/null 2>&1); then
                sleep 3
                echo "recreated -> $(docker inspect amux-watchdog-$u --format '{{.State.Status}} restarts={{.RestartCount}}' 2>/dev/null)"
              else
                echo "FAILED to recreate watchdog"
              fi
            done
            echo
            echo "=== crashloopers remaining (want: none) ==="
            timeout 30 docker ps -a --filter status=restarting --format '  {{.Names}}\t{{.Status}}' 2>&1 | head -12
            echo "  (empty above = no container is crashlooping)"
          ENDSSH
