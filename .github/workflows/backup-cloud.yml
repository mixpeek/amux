name: Daily backup — cloud containers

on:
  schedule:
    # 3:00 AM UTC every day
    - cron: '0 3 * * *'
  workflow_dispatch:

# ONE host, named once, matching deploy-cloud.yml's `CLOUD_HOST`.
#
# AMUX-2811: this workflow hardcoded 5.161.66.217 — the RETIRED HETZNER box — in
# two places, and kept doing so after the move to GCP. `deploy-cloud.yml` was
# updated and this one was not, so backups SSH'd nightly to a host that no
# longer answers: `ssh-keyscan -H 5.161.66.217` returns nothing, the step runs
# under `bash -e`, and the job dies in the SSH setup before it ever reaches the
# backup. Six consecutive nights (2026-08-05..08-10) failed that way.
#
# The card blamed the same lost-SSH-key breakage that took out the deploy. That
# was WRONG and is recorded here so nobody re-derives it: the key is fine, the
# ADDRESS is dead. Two workflows spelling the same host two different ways is
# what let one of them rot unnoticed — hence a single env var rather than a
# second literal.
env:
  CLOUD_HOST: ${{ vars.CLOUD_HOST || '34.121.177.76' }}

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.CLOUD_SSH_KEY }}" > ~/.ssh/amux_cloud
          chmod 600 ~/.ssh/amux_cloud
          # FAIL LOUDLY ON AN UNREACHABLE HOST. `ssh-keyscan` exits 0 when it
          # finds nothing, so the dead-host case used to surface as a bare
          # "exit code 1" from a later line with no reason attached — which is
          # why six nightly failures said nothing about what was wrong.
          if ! ssh-keyscan -H "$CLOUD_HOST" >> ~/.ssh/known_hosts 2>/dev/null \
             || ! grep -q . ~/.ssh/known_hosts; then
            echo "::error::ssh-keyscan returned no host key for $CLOUD_HOST — the host is \
          unreachable or the address is stale. This is the AMUX-2811 failure: the address was \
          pointing at a decommissioned server, not the key being wrong."
            exit 1
          fi
          chmod 644 ~/.ssh/known_hosts

      - name: Run backup on server
        run: |
          ssh -i ~/.ssh/amux_cloud "root@$CLOUD_HOST" 'bash -s' << 'ENDSSH'
            set -e
            BACKUP_DIR="/var/amux/backups/$(date +%Y-%m-%d)"
            # Retention in DAYS. 30 was untenable: /var/amux/backups accrues
            # ~1.7GB/day and 30 days (~51GB) exceeds the ~49GB host disk, so the
            # host hit 100% full on 2026-08-13 and CONTAINER WRITES started failing
            # with "no space left on device" — the real root of the "Failed to
            # load" reports (amux-cloud incident). Tunable; keep it well under
            # disk/day so there is always headroom.
            KEEP_DAYS=7

            # PRUNE FIRST, then write. The old order pruned AFTER the copy, so on a
            # near-full disk the copy failed with ENOSPC and the prune it needed was
            # never reached — the failure fed itself. Freeing space before writing
            # is what breaks that loop. Count-based (newest KEEP_DAYS-1 kept, so
            # today's makes KEEP_DAYS) so it is bounded regardless of clock skew.
            prune() { ls -1d /var/amux/backups/20* 2>/dev/null | sort -r | tail -n +"$1" | xargs -r rm -rf; }
            prune "$KEEP_DAYS"

            mkdir -p "$BACKUP_DIR"
            cp /var/amux/gateway.db "$BACKUP_DIR/gateway.db"
            for vol in $(docker volume ls --format '{{.Name}}' | grep '^amux-data-'); do
              user_id="${vol#amux-data-}"
              dest="$BACKUP_DIR/$user_id"
              mkdir -p "$dest"
              docker run --rm \
                -v "$vol:/data:ro" \
                -v "$dest:/backup" \
                alpine sh -c 'cp /data/amux.db /backup/amux.db 2>/dev/null || true'
            done

            # Backstop prune (keep exactly KEEP_DAYS including today).
            prune "$((KEEP_DAYS + 1))"

            # SURFACE DISK HEADROOM every run (two-fixes rule): the incident had NO
            # early warning — the disk simply hit 100%. Now every backup logs free
            # space and WARNS below a floor, so the trend toward full is visible in
            # the workflow log BEFORE writes start failing.
            AVAIL=$(df -BG --output=avail /var/amux | tail -1 | tr -dc '0-9')
            echo "Backup complete: $BACKUP_DIR — /var/amux has ${AVAIL:-?}G free (retention ${KEEP_DAYS}d)"
            if [ "${AVAIL:-0}" -lt 5 ]; then
              echo "::warning::/var/amux has only ${AVAIL}G free after backup — lower KEEP_DAYS or grow the disk (amux-cloud disk-full incident 2026-08-13)"
            fi
            ls -lh "$BACKUP_DIR"
          ENDSSH

      - name: Confirm the backup actually landed
        run: |
          # A backup job that reports success without checking is the failure
          # mode this card is an instance of: nobody noticed six missing nights
          # because nothing ever asserted a file exists. Verify from a SECOND
          # connection, so a half-open session cannot pass for a written file.
          ssh -i ~/.ssh/amux_cloud "root@$CLOUD_HOST" 'bash -s' << 'ENDSSH'
            set -e
            DIR="/var/amux/backups/$(date +%Y-%m-%d)"
            [ -s "$DIR/gateway.db" ] || { echo "::error::$DIR/gateway.db missing or empty"; exit 1; }
            N=$(find "$DIR" -name amux.db -size +0 | wc -l)
            echo "verified: gateway.db $(stat -c%s "$DIR/gateway.db") bytes, $N user db(s)"
            # Zero user DBs is legitimate only if there are zero volumes; say
            # which, rather than passing silently on an empty backup.
            V=$(docker volume ls --format '{{.Name}}' | grep -c '^amux-data-' || true)
            [ "$N" -gt 0 ] || [ "$V" -eq 0 ] || { echo "::error::$V volume(s) but 0 user DBs backed up"; exit 1; }
          ENDSSH
