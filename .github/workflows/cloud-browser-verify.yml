name: Cloud browser verify (headless profile save + reuse)

# Ground-truth proof that browser automation works in a cloud container with NO
# display: a profile can be created, written into, and READ BACK by a later,
# separate browser session. Reuse is the part that matters — a profile that
# saves but doesn't reload is indistinguishable from no profile at all.
#
# Runs inside the container over docker exec rather than through the gateway,
# so nothing about the result depends on auth, cookies, or proxy behaviour.
# Read-only except the throwaway probe profile.
#
# Two traps this file exists to avoid:
#  - Request bodies go in over STDIN, never inside `-d '...'`. JS payloads
#    contain single quotes, which closed the shell's quoting and delivered a
#    mangled script — the eval then returned null and read as "nothing
#    persisted" when nothing had ever been written.
#  - Responses print untruncated. With `head -c 400` an empty body looked
#    identical to a successful one.

on:
  workflow_dispatch:
    inputs:
      org:
        description: 'org id (container amux-user-<org>)'
        required: true
      profile:
        description: 'throwaway probe profile name'
        required: false
        default: 'pvprobe'

env:
  CLOUD_HOST: ${{ vars.CLOUD_HOST || '34.121.177.76' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.CLOUD_SSH_KEY }}" > ~/.ssh/amux_cloud
          chmod 600 ~/.ssh/amux_cloud
          ssh-keyscan -H "$CLOUD_HOST" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Verify headless profile create / save / reuse
        env:
          ORG: ${{ inputs.org }}
          PROF: ${{ inputs.profile }}
          TOKEN: run${{ github.run_id }}
        run: |
          ssh -i ~/.ssh/amux_cloud root@"$CLOUD_HOST" \
            "ORG='$ORG' PROF='$PROF' TOKEN='$TOKEN' bash -s" <<'ENDSSH'
            C="amux-user-${ORG}"
            P="/root/.amux/playwright-auth/profiles"
            SITE="http://localhost:8822/"
            ex() { docker exec "$C" sh -lc "$1" 2>&1; }

            # $1 = endpoint, $2 = JSON body (piped in, never shell-quoted)
            api() {
              printf '%s' "$2" | docker exec -i "$C" sh -c \
                "cat > /tmp/req.json && curl -sS --max-time 90 -X POST \
                 localhost:8822/api/browser/$1 -H 'Content-Type: application/json' \
                 -d @/tmp/req.json" 2>&1
            }
            # $1 = JS source, $2 = session. JS may contain single quotes freely.
            evl() {
              api action "{\"action\":\"eval\",\"script\":\"$(printf '%s' "$1" | sed 's/\\/\\\\/g; s/"/\\"/g')\",\"session\":\"$2\"}"
            }

            echo "=== 0. environment ==="
            ex 'cd /app && node -e "console.log(require.resolve(\"playwright\"))"'
            echo "  DISPLAY=[$(ex 'echo -n "$DISPLAY"')]  (empty => headless path)"

            echo
            echo "=== 1. create profile via the UI's own endpoint ==="
            ex "rm -rf $P/$PROF $P/$PROF.log"
            api profile/create "{\"name\":\"$PROF\",\"url\":\"https://example.com\"}"
            echo
            echo "  waiting for the detached launcher..."
            sleep 25
            echo "  --- launcher log ---"
            ex "cat $P/$PROF.log 2>&1" | sed 's/^/    /'
            # Ask the server where the profile actually is rather than assuming
            # the legacy path — this check reported "NO PROFILE DIR" for a
            # profile that had been created correctly, just somewhere else.
            ex "ls -d /root/.config/google-chrome/$PROF $P/$PROF 2>/dev/null || echo '    NO PROFILE DIR IN EITHER STORE'" | sed 's/^/    /'

            echo
            echo "=== 2. WRITE through a browser session on that profile ==="
            api start "{\"url\":\"$SITE\",\"session\":\"probe1\",\"profile\":\"$PROF\"}"
            echo
            echo "  origin:        $(evl "location.origin" probe1)"
            echo "  cookie write:  $(evl "document.cookie='amux_probe=$TOKEN; path=/; max-age=86400'; document.cookie" probe1)"
            echo "  localSt write: $(evl "localStorage.setItem('amux_probe','$TOKEN'); localStorage.getItem('amux_probe')" probe1)"
            # Distinguishes "never written" from "written but never flushed".
            # Chrome flushes cookies to its sqlite on a timer (~30s) as well as
            # on clean shutdown, so a value that appears on disk BEFORE we ask
            # the session to close means the write was fine and the shutdown is
            # what loses it.
            # THE decisive readout, taken while the write session is still OPEN.
            # The one further down runs after the stop, so it can only ever show
            # leftovers — it cannot say which directory the browser that did the
            # WRITING was using, which is the whole question. Reading it here
            # separates "profile opened, storage not flushed" from "the named
            # profile was never opened at all and the writes went to /tmp".
            echo
            echo "  -- LIVE cmdline of the session that just wrote (session still open):"
            ex 'for p in $(pgrep -f "chrome|chromium" 2>/dev/null); do tr "\0" "\n" < /proc/$p/cmdline 2>/dev/null; done | grep -e "--user-data-dir" -e "--profile-directory" | sort | uniq -c' | sed 's/^/     /'
            echo "     (expect --user-data-dir=/root/.config/google-chrome AND --profile-directory=$PROF)"
            echo
            echo "  waiting 40s for Chrome's own periodic flush (no close yet)"
            sleep 40
            ex "grep -a -r -q amux_probe '/root/.config/google-chrome/$PROF' 2>/dev/null && echo '    token on disk BEFORE close (write is fine; shutdown is the problem)' || echo '    token NOT on disk before close'"
            echo "  closing session (graceful close is what flushes storage to disk)"
            api stop "{\"session\":\"probe1\"}"
            echo
            sleep 6
            ex "ls /root/.config/google-chrome/SingletonLock >/dev/null 2>&1 && echo '    SingletonLock still present => Chrome did NOT exit cleanly' || echo '    SingletonLock gone => clean Chrome exit'"

            echo
            echo "=== 2a. DECISIVE READ: what dir is Chrome ACTUALLY using? ==="
            # Everything else here infers the profile from where bytes land on
            # disk. This reads it from the process itself. If --profile-directory
            # is absent, or --user-data-dir points at a temp path, then browser-use
            # is not honouring the named profile and no amount of flush-waiting
            # will make a login persist -- the fix is to drive Playwright directly
            # for the profile-backed backend.
            echo "  chrome processes:"
            ex 'for p in $(pgrep -f "chrome|chromium" 2>/dev/null); do tr "\\0" " " < /proc/$p/cmdline 2>/dev/null; echo; done' | sed 's/^/     /'
            echo "  profile-relevant flags (deduped):"
            ex 'for p in $(pgrep -f "chrome|chromium" 2>/dev/null); do tr "\\0" "\\n" < /proc/$p/cmdline 2>/dev/null; done | grep -e "--user-data-dir" -e "--profile-directory" | sort -u' | sed 's/^/     /'
            echo "  (empty above = no chrome running at this point, NOT a pass)"

            echo "=== 2b. ON-DISK ground truth (independent of any later session) ==="
            # Cookie names and localStorage keys are plain text inside the
            # sqlite/leveldb files, so grep -a proves the write reached disk
            # without needing sqlite3 in the image.
            #
            # Checks BOTH candidate stores. amux creates profiles with Playwright
            # under playwright-auth/profiles/<name>, while browser-use's
            # `-b real --profile <name>` resolves to <chrome-user-data-dir>/<name>.
            # If the bytes land in the second, create-path and use-path are not
            # the same directory and a UI login can never take effect.
            for D in "$P/$PROF" "/root/.config/google-chrome/$PROF"; do
              echo "  -- $D"
              ex "test -d '$D' && echo '     exists' || echo '     ABSENT'"
              ex "grep -a -q amux_probe '$D/Default/Cookies' 2>/dev/null || grep -a -q amux_probe '$D/Cookies' 2>/dev/null && echo '     cookie amux_probe IS here' || echo '     cookie amux_probe not here'"
              ex "grep -a -r -q amux_probe '$D' 2>/dev/null && echo '     token IS somewhere under this dir' || echo '     token not under this dir'"
            done
            echo "  -- chrome user-data-dir contents:"
            # NOT truncated: a head -10 here is what cut off the entry that
            # mattered and produced the wrong conclusion twice (handoff rule 3).
            ex "ls -la /root/.config/google-chrome/ 2>&1" | sed 's/^/     /'

            echo
            echo "=== 3. READ BACK from a SEPARATE session on the same profile ==="
            # The shared amux-server.py mount means a deploy can execv-restart the
            # server mid-run; an unreachable port then reads as "nothing
            # persisted". Wait for it to answer before drawing any conclusion.
            for i in $(seq 1 30); do
              ex "curl -sf -o /dev/null --max-time 3 localhost:8822/api/sessions" >/dev/null 2>&1 && break
              sleep 2
            done
            ex "curl -sf -o /dev/null --max-time 3 localhost:8822/api/sessions && echo '  server is up' || echo '  SERVER STILL DOWN — result below is not meaningful'"
            api start "{\"url\":\"$SITE\",\"session\":\"probe2\",\"profile\":\"$PROF\",\"fresh\":true}"
            echo
            CK=$(evl "document.cookie" probe2)
            LS=$(evl "localStorage.getItem('amux_probe')" probe2)
            echo "  cookie read-back:  $CK"
            echo "  localSt read-back: $LS"
            api stop "{\"session\":\"probe2\"}" >/dev/null 2>&1

            echo
            echo "=== VERDICT ==="
            OK=0
            case "$CK" in *"$TOKEN"*) echo "  cookie       PASS"; OK=1 ;; *) echo "  cookie       fail" ;; esac
            case "$LS" in *"$TOKEN"*) echo "  localStorage PASS"; OK=1 ;; *) echo "  localStorage fail" ;; esac
            if [ "$OK" = 1 ]; then
              echo "  PASS — profile persisted across separate browser sessions (token $TOKEN survived)"
            else
              echo "  FAIL — token $TOKEN did not survive; profile is not being reused"
              exit 1
            fi
          ENDSSH
