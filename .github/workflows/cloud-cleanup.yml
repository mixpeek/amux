name: Cloud cleanup (destructive)

# Removes local Docker volumes + compose dirs for orgs/users that no longer have
# a Clerk account. R2 is NEVER touched — it holds ~/.amux for 66 users and is the
# only recovery material for the accounts destroyed by the e2e incident.
#
# KEEP_IDS below is an explicit allowlist of accounts that must survive. Anything
# not in it, and not passed as extra_keep, is removed.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DELETE to confirm (dry run otherwise)'
        required: true
        default: 'dry-run'
      extra_keep:
        description: 'Extra user/org ids to preserve (comma-separated)'
        required: false
        default: ''

env:
  CLOUD_HOST: ${{ vars.CLOUD_HOST || '34.121.177.76' }}

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.CLOUD_SSH_KEY }}" > ~/.ssh/amux_cloud
          chmod 600 ~/.ssh/amux_cloud
          ssh-keyscan -H "$CLOUD_HOST" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Cleanup
        env:
          CONFIRM: ${{ inputs.confirm }}
          EXTRA_KEEP: ${{ inputs.extra_keep }}
        run: |
          cat > /tmp/clean.sh <<'SCRIPT'
          set -u
          # Live Clerk accounts as of 2026-07-29 — these MUST survive.
          # ethan@mixpeek.com, doron@mixpeek.com, brendon@athenaintel.com,
          # gnh3466@gmail.com, tal@craftflow.com
          KEEP_IDS="user_3AP4n5hreSZdTsJbhIt22Xv6LDh user_3AXXRfBD8iIUrb9YB4eZHNcButk user_3AdFaFgyotBszajabslluOecZvx user_3ArIreP7oHP27ZH67twCizbLm4p user_3Ax4co7Sa37KwLrcwG6H7vgzUWE"
          for e in $(echo "$EXTRA_KEEP" | tr ',' ' '); do
            [ -n "$e" ] && KEEP_IDS="$KEEP_IDS $e"
          done
          keep() { case " $KEEP_IDS " in *" $1 "*) return 0;; *) return 1;; esac; }

          echo "preserving: $KEEP_IDS"
          echo "mode: $([ "$CONFIRM" = "DELETE" ] && echo LIVE || echo DRY-RUN)"
          echo

          FREED_BEFORE=$(df -k /var | tail -1 | awk '{print $4}')
          n=0
          for d in /var/amux/users/*/; do
            id=$(basename "$d")
            keep "$id" && { echo "  KEEP  $id"; continue; }
            n=$((n+1))
            echo "  DROP  $id"
            if [ "$CONFIRM" = "DELETE" ]; then
              ( cd "$d" && docker compose down -v --remove-orphans >/dev/null 2>&1 ) || true
              for p in amux-user- amux-watchdog- amux-litestream- amux-sync-; do
                docker rm -f "${p}${id}" >/dev/null 2>&1 || true
              done
              docker volume rm -f "amux-data-${id}" "root-home-${id}" >/dev/null 2>&1 || true
              rm -rf "$d"
            fi
          done
          echo
          echo "orgs/users targeted: $n"

          # Orphan volumes with no matching dir (belt and braces)
          for v in $(docker volume ls -q --filter name=amux-data- --filter name=root-home-); do
            id=$(echo "$v" | sed -E 's/^(amux-data-|root-home-)//')
            keep "$id" && continue
            echo "  DROP volume $v"
            [ "$CONFIRM" = "DELETE" ] && docker volume rm -f "$v" >/dev/null 2>&1 || true
          done

          if [ "$CONFIRM" = "DELETE" ]; then
            docker image prune -af >/dev/null 2>&1 || true
            FREED_AFTER=$(df -k /var | tail -1 | awk '{print $4}')
            echo "  freed: $(( (FREED_AFTER - FREED_BEFORE) / 1024 )) MB"
          fi
          echo
          df -h /var | tail -1 | awk '{print "  /var now: "$5" used of "$2}'
          echo "  R2 untouched (recovery material preserved)"
          SCRIPT
          ssh -i ~/.ssh/amux_cloud root@"$CLOUD_HOST" \
            "CONFIRM='$CONFIRM' EXTRA_KEEP='$EXTRA_KEEP' bash -s" < /tmp/clean.sh
