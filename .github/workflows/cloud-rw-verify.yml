name: Cloud read/write verify (every workspace, every surface)

# Answers "are sessions, logs, files and boards actually readable AND editable
# in every provisioned workspace" from inside each container, so the result does
# not depend on anyone's login. The gateway only puts auth in front of these
# same endpoints.
#
# Non-destructive: it writes ONE clearly-named probe file and ONE probe board
# item, then removes exactly those two. It never touches existing data.

on:
  workflow_dispatch:

env:
  CLOUD_HOST: ${{ vars.CLOUD_HOST || '34.121.177.76' }}

jobs:
  rw:
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.CLOUD_SSH_KEY }}" > ~/.ssh/amux_cloud
          chmod 600 ~/.ssh/amux_cloud
          ssh-keyscan -H "$CLOUD_HOST" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Read/write every surface in every workspace
        env:
          TOKEN: rw${{ github.run_id }}
        run: |
          ssh -i ~/.ssh/amux_cloud root@"$CLOUD_HOST" "TOKEN='$TOKEN' bash -s" <<'ENDSSH'
            FAIL=0
            ASSERTED=0
            for C in $(docker ps --filter name=amux-user- --format '{{.Names}}' | sort); do
              ORG="${C#amux-user-}"
              ex() { docker exec "$C" sh -lc "$1" 2>&1; }
              post() { printf '%s' "$2" | docker exec -i "$C" sh -c "cat > /tmp/rw.json && curl -sS --max-time 30 -X POST localhost:8822$1 -H 'Content-Type: application/json' -d @/tmp/rw.json" 2>&1; }
              put()  { printf '%s' "$2" | docker exec -i "$C" sh -c "cat > /tmp/rw.json && curl -sS --max-time 30 -X PUT  localhost:8822$1 -H 'Content-Type: application/json' -d @/tmp/rw.json" 2>&1; }

              echo "=============================================================="
              echo "workspace: $ORG"

              N=$(ex 'tmux list-sessions -F "#{session_name}" 2>/dev/null | wc -l' | tr -d ' ')
              echo "  sessions: $N"
              [ "$N" = "0" ] && { echo "    (empty workspace — nothing to read)"; continue; }

              echo "  -- LOGS readable (scrollback per session):"
              ex 'tmux list-sessions -F "#{session_name}" 2>/dev/null | while read s; do
                    n=$(tmux capture-pane -p -S - -t "$s" 2>/dev/null | grep -c .)
                    printf "     %-40s %5s lines\n" "$s" "$n"
                  done'

              echo "  -- FILES read + write (PUT then GET then remove):"
              F="/root/amux-rw-probe-$TOKEN.txt"
              # path goes in the BODY, not the query string (amux-server.py
              # /api/file PUT reads body["path"]) — sending ?path= silently
              # wrote nothing and the read-back then "correctly" found nothing.
              put "/api/file" "{\"path\":\"$F\",\"content\":\"probe $TOKEN\"}" | head -c 160; echo
              GOT=$(ex "curl -sS --max-time 20 'localhost:8822/api/file?path=$F'")
              case "$GOT" in
                *"$TOKEN"*) echo "     files: WRITE+READ OK" ;;
                *)          echo "     files: FAILED -> $(echo "$GOT" | head -c 200)"; FAIL=1 ;;
              esac
              ASSERTED=1
              case x in x)
              esac
              ex "rm -f $F"

              echo "  -- BOARD read + write (create, move, delete):"
              BEFORE=$(ex "curl -sS --max-time 20 localhost:8822/api/board | tr ',' '\n' | grep -c '\"id\"'")
              NEW=$(post "/api/board" "{\"title\":\"rw probe $TOKEN\",\"status\":\"todo\"}")
              ID=$(printf '%s' "$NEW" | tr ',' '\n' | grep -o '"id": *"[^"]*"' | head -1 | cut -d'"' -f4)
              if [ -n "$ID" ]; then
                # Capture the PATCH response. Sending it to /dev/null hid a real
                # 409 ("gate not acknowledged") and left me reporting a genuine
                # product bug as a parse bug in this very script. Never discard a
                # response body to keep output tidy. todo->doing on a type=code
                # card requires acking the gate.
                PR=$(printf '%s' '{"status":"doing","gate_ack":true}' | docker exec -i "$C" sh -c "cat > /tmp/rw.json && curl -sS --max-time 20 -X PATCH localhost:8822/api/board/$ID -H 'Content-Type: application/json' -d @/tmp/rw.json" 2>&1)
                echo "     PATCH response: $(printf '%s' "$PR" | head -c 300)"
                # Parse with python3, not `tr '}'` — card descs contain literal
                # '}' and shatter record-splitting on that character. Kept to one
                # line: a multi-line script restarts at column 0 and breaks the
                # YAML block scalar.
                MOVED=$(ex "curl -sS --max-time 20 localhost:8822/api/board" | python3 -c "import json,sys; d=json.load(sys.stdin); m=[i for i in d if i.get('id')=='$ID']; print(m[0].get('status') if m else 'NOT_IN_LISTING')" 2>&1)
                case "$MOVED" in
                  doing) echo "     board: CREATE+MOVE OK (items before=$BEFORE)" ;;
                  *)     echo "     board: move FAILED -> status=$MOVED resp=$(printf '%s' "$PR" | head -c 200)"; FAIL=1 ;;
                esac
                ex "curl -sS --max-time 20 -X DELETE localhost:8822/api/board/$ID >/dev/null"
                echo "     board: probe item removed"
              else
                echo "     board: CREATE FAILED -> $(echo "$NEW" | head -c 200)"; FAIL=1
              fi
            done
            echo
            echo "=== VERDICT ==="
            # A verdict that cannot fail is worse than the bug it was meant to
            # catch: a broken loop body once printed PASS having asserted
            # nothing. Require evidence that at least one assertion actually ran.
            if [ "$ASSERTED" = 0 ]; then
              echo "  FAIL — no workspace was actually asserted; the run proved nothing"
              exit 1
            fi
            [ "$FAIL" = 0 ] && echo "  PASS — every non-empty workspace is readable and editable" \
                            || { echo "  FAIL — see surfaces marked FAILED above"; exit 1; }
          ENDSSH
