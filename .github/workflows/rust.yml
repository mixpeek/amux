name: rust
# CI for the Rust rebuild (Phase 0 seed of the RR-Phase-10 pipeline).
# Grows stages as phases land: Playwright golden scenarios, perf baselines,
# migration rehearsal. Every stage here must be able to FAIL (ethos rule 7).
on:
  push:
    branches: [main]
    # `amux` + `scripts/**` are here so the CLI gates below (shellcheck + the AF-78
    # launch smoke) actually FIRE when the bash CLI or its tests change. Without them
    # a PR that touched ONLY `amux` (the exact way AMUX-3145 was reintroduced) ran
    # neither gate, so the guard existed but never met the file it guards. The cost is
    # that a CLI-only change also runs the cargo + e2e jobs; over-covering is the safe
    # direction for a gate.
    # `eslint.config.mjs` is here because the e2e job's SPA static gate
    # (scripts/spa-lint.sh) READS it for the vendor-global allowlist, but it lives
    # at repo root, outside every other pattern. Without it a fix to the lint
    # config alone could not re-trigger the very gate it fixes, so a red spa-lint
    # stayed red after the fix landed (32c416b: whitelisting XLSX did not re-run CI).
    # `cloud/**` is the THIRD instance of the same shape as the two notes above,
    # and it was found the same way — by a fix that could not prove itself.
    # `dockerfile_copies_every_external_include_str_input` reads
    # cloud/docker/Dockerfile and asserts it COPYs every external include_str!
    # root, but `cloud/**` was in no pattern, so the test that GUARDS that file
    # never ran when that file changed. Two consequences, and the second is the
    # dangerous one: a PR fixing the Dockerfile ran only the secret scan and
    # could not demonstrate the fix (AEAB-55), and a PR BREAKING it by editing
    # only the Dockerfile would have gone green. The break would then surface as
    # a dead cloud image on the next deploy — which is exactly the latency the
    # test was written to remove.
    #
    # The AEAB-55 fix itself is the argument for this one. That COPY reached main
    # by being "swept into that commit through the shared index while staged"
    # (23eac180) rather than through a reviewed change — so no PR gated it, and
    # with `cloud/**` absent no PR could have. A test that cannot run when its
    # subject changes does not catch the sweep going the other way.
    paths: ['crates/**', 'Cargo.toml', 'Cargo.lock', 'e2e/**', 'amux', 'scripts/**', 'cloud/**', 'eslint.config.mjs', '.github/workflows/rust.yml']
  pull_request:
    paths: ['crates/**', 'Cargo.toml', 'Cargo.lock', 'e2e/**', 'amux', 'scripts/**', 'cloud/**', 'eslint.config.mjs', '.github/workflows/rust.yml']

# No group ran the full ~20min check+e2e once per push with nothing
# superseding anything, so a burst of pushes to main paid full price for
# every one of them (mixpeek-cicd, 2026-09-14: rust was 82% of this repo's
# GitHub Actions minutes, $222/mo of that in e2e alone). Group by PR number
# when this is a pull_request run, by ref otherwise (push to main) — a new
# push cancels its own stale run rather than racing it to completion.
#
# MAIN IS NEVER CANCELLED (2026-10-01). With lanes pushing every few minutes,
# cancel-in-progress on main meant 39 of the last 60 main runs were cancelled
# and none succeeded, so main could not produce a verdict at all and "CI red"
# could never clear. For pushes to main GitHub now lets the running run finish
# and keeps ONE pending run, which a newer push replaces, so every completed
# run judges a recent head. Pull requests still cancel their own stale runs.
concurrency:
  group: rust-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # check/clippy, doctests and the CLI smokes. The workspace test suite used
  # to run here too, serially after clippy: 7 min to compile the test
  # binaries, then 10 min running amux-server's 3300 lib tests on one 4-core
  # runner (run 36323581857). It now runs in `test-build` + `test-shards`,
  # in parallel with this job.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo check (workspace)
        run: cargo check --workspace --all-targets
      - name: clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
      # nextest (the `test` shards below) cannot run doctests, so they run
      # here, beside check and clippy, rather than on the test critical path.
      - name: cargo test --doc (workspace)
        run: cargo test --doc --workspace
      # AF-74. The `amux` bash CLI is a shipped client with no compiler behind
      # it, and `bash -n` (the pre-commit gate) proves the file PARSES, not that
      # its names resolve. This catches the classes shellcheck CAN see.
      #
      # IT DOES NOT COVER AMUX-3145, the incident that motivated the card, and
      # that is measured, not assumed: I rebuilt the specimen (deleted the
      # `local AMUX_API=...` decl from cmd_start so the later use is unbound)
      # and this gate exits 0 on it. SC2154 only fires for a name assigned
      # NOWHERE in the file; `AMUX_API` is assigned in other functions, and
      # shellcheck does not do per-function `local` scope analysis. A comment
      # here claiming it guards the unbound-var class would be exactly the
      # theatre ethos rule 7 is about. That class needs a runtime smoke test
      # (mocked tmux, AMUX_API unset, reach the real inject) -- filed as AF-78.
      #
      # -e excludes the 9 findings present when this landed, each deliberate:
      #   SC1090 dynamic `source`; SC2016 single-quoted python heredocs (the
      #   whole point is NOT expanding); SC2221/SC2222 overlapping case globs in
      #   the sign-in matcher; SC2015 two intentional A && B || C; SC1039 an
      #   indented heredoc terminator.
      # A DENY-LIST on purpose: a new code fails the build instead of being
      # silently absorbed, which is what an allow-list would do.
      - name: shellcheck the amux CLI (new classes only; NOT the AMUX-3145 scope shape)
        run: shellcheck -S warning -e SC1090,SC2016,SC2221,SC2222,SC2015,SC1039 amux
      # AF-78. The shellcheck step above says in its own name what it cannot see: the
      # AMUX-3145 scope shape, a `local` USED outside the function that declared it.
      # SC2154 fires only for a name assigned NOWHERE in the file, and AMUX_API is
      # `local`-assigned in five other functions, so shellcheck exits 0 on it while
      # `set -euo pipefail` makes the out-of-scope use a hard "unbound variable" at
      # launch. This runtime smoke runs the REAL non-dry-run launch path (tmux stubbed,
      # AMUX_API unset, no fleet touched) so that shape surfaces as a non-zero exit, and
      # it carries its own negative control (a deliberately-broken copy with the
      # declaration deleted) so the check provably CAN fail (ethos rule 7). It
      # complements the static gate; it does not replace it.
      - name: runtime smoke -- CLI launch unbound-var (the AMUX-3145 scope shape shellcheck cannot see)
        run: bash scripts/test-cli-launch-unbound.sh
      # AF-120: the frustrations audit existed, detected its failure class
      # precisely (a headingless append folds into the previous entry and
      # vanishes from every census), and NOTHING RAN IT — six malformed
      # entries landed on main while the purpose-built check sat unread.
      # This step is its CI consumer; the pre-commit hook is the local one.
      # Exit contract (the script's own docstring, which the first wiring of
      # this step did not read): 0 clean, 1 structural problems (decidable
      # with NO board, so it must fail here), 2 board unreachable with
      # structure clean — CI never has a board, so 2 is this environment's
      # green. Failing on 2 turned the consumer red on every push (33b92a5).
      - name: frustrations.md structural audit + its own test suite (AF-120)
        run: |
          set +e
          python3 scripts/frustrations_audit.py > /dev/null
          rc=$?
          set -e
          if [ "$rc" != "0" ] && [ "$rc" != "2" ]; then
            python3 scripts/frustrations_audit.py | head -20
            exit "$rc"
          fi
          bash scripts/test-frustrations-audit.sh

      # MHC-377. `amux board status-update <ID> --outcome-file <path>` used to
      # record the literal flag string, print "status update posted" and exit 0,
      # losing the file. Silent, on the success path, and shellcheck cannot see
      # it because `local text="$*"` is valid shell. Sixteen writes were lost to
      # it across two sessions before anyone read a field back. Pins both
      # directions: the flag shapes must refuse without POSTing, and prose,
      # --stdin and --file must reach the wire byte-for-byte.
      - name: runtime smoke -- board status-update refuses flag-shaped prose (MHC-377 data loss)
        run: bash scripts/test-cli-status-update-flags.sh

      # AF-195. The guard refuses a commit whose staged bytes are not the bytes
      # on disk, and must NOT refuse `git commit -a` or `git commit -- <path>`,
      # which resolve through a temporary index built FROM the working tree.
      # That second half is a claim about git's behaviour rather than about our
      # code, so it needs a real repo and a real `git commit` — reading the hook
      # cannot settle it, and getting it wrong makes the guard fire on every
      # ordinary commit, which is how a guard becomes a thing people bypass.
      - name: runtime smoke -- staged-guard refuses an index that is not the worktree (AF-195)
        run: bash scripts/test-index-worktree-divergence.sh

      # AMUX-3667. CI has no `.cargo/config.toml` (install.sh writes it and it
      # is gitignored), so this SKIPS here and exits 0. That is deliberate and
      # it is not theatre: the half CI can genuinely break is the CONTROL —
      # this job sets CARGO_TARGET_DIR itself, serve-head.sh exports its own
      # (AMUX-2961), and a future change that let `build.target-dir` win over
      # the env would move both silently. The script asserts that precedence
      # empirically, so when a config IS present the control runs; keeping the
      # step wired means the day someone commits a config, or CI starts running
      # install.sh, the assertion is already here rather than remembered.
      - name: runtime smoke -- a bare cargo does not build into the checkout (AMUX-3667)
        run: bash scripts/test-cargo-target-dir-pinned.sh

      # AMUX-3682. Two runtime hooks ran uncommitted for four days each because
      # install.sh copied the WORKTREE while its own comments claimed the
      # committed copy was authoritative. CI is the right home for this: the
      # dirty-worktree cell builds its own throwaway repo, so it needs no
      # fixture from this checkout and cannot pass for the wrong reason on a
      # clean CI tree.
      - name: runtime smoke -- hooks install from HEAD, not the worktree (AMUX-3682)
        run: bash scripts/test-hook-install-from-head.sh

  # Compile every test binary ONCE and hand the shards a nextest archive, so
  # no shard pays the ~7 min compile. The env below applies to this job only.
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Debuginfo is most of the link time and archive size for binaries this
      # large. Panic messages keep file:line without it (core::panic::Location).
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: rui314/setup-mold@v1
      # Optimise DEPENDENCIES only (workspace crates stay debug, with
      # debug_assertions). The long pole was one request_log test inserting
      # 260k rows through an -O0 bundled SQLite: 163s of a 174s shard. In
      # $CARGO_HOME so it cannot touch the checkout; `key` below keeps the
      # cache from restoring -O0 deps under the same key and never re-saving.
      - name: Optimise dependencies for the test build
        run: printf '[profile.dev.package."*"]\nopt-level = 2\n' >> "${CARGO_HOME:-$HOME/.cargo}/config.toml"
      - uses: Swatinem/rust-cache@v2
        with:
          key: deps-opt2
      - uses: taiki-e/install-action@nextest
      - name: Build all workspace test binaries into a nextest archive
        run: cargo nextest archive --workspace --archive-file ${{ runner.temp }}/nextest.tar.zst
      - uses: actions/upload-artifact@v4
        with:
          name: nextest-archive
          path: ${{ runner.temp }}/nextest.tar.zst
          if-no-files-found: error
          retention-days: 1

  # The workspace suite, split across runners by nextest partition. Every
  # test in the archive runs in exactly one shard; `test` below refuses a
  # green unless every shard succeeded.
  test-shards:
    needs: test-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@nextest
      - uses: actions/download-artifact@v4
        with:
          name: nextest-archive
          path: ${{ runner.temp }}
      # AF-150 (AREA silent-partial). A test fixture created a directory in the
      # checkout to prove a refusal, the refusal was later removed, and the
      # residue outlived the run — turning a green test red on every machine
      # WITH history while CI, freshly checked out, stayed green (67137cc).
      # CI is the right place to catch it precisely because a fresh checkout
      # has no history for residue to hide in: this run is the only thing that
      # could have made it.
      #
      # The self-test runs FIRST as a negative control. A guard nobody has
      # watched fail is a guard nobody should trust — and this one's own
      # self-test shipped once asserting merely "non-zero", which passed while
      # carrying the exact bug the control existed to catch (7ca3f68).
      - name: Tree-residue guard — self-test (negative control)
        run: bash scripts/test-tree-clean.sh --self-test
      # Wrapped, not run-after, so the guard cannot drift away from what it
      # guards. Exit codes (7ca3f68): 0 clean · 3 command SUCCEEDED but left
      # residue · anything else is the command's own rc, which always wins.
      #
      # ADVISORY ON RESIDUE FOR NOW, deliberately: this gates every lane's
      # push, and a detector that has never been observed silent across real
      # runs should not block — that is the threshold-below-baseline trap in a
      # new suit. Only code 3 is downgraded, so a genuine cargo failure still
      # fails the job. Flip to blocking (delete the `if`) once it has been
      # quiet for a few days; leaving it advisory forever would make it
      # decoration.
      - name: cargo nextest (shard ${{ matrix.shard }}/8) — tree-residue guarded
        env:
          AMUX_REQUIRE_TMUX: '1'
        run: |
          set -uo pipefail
          command -v tmux >/dev/null || { sudo apt-get update && sudo apt-get install -y tmux; } || exit 1
          # Extracting into the workspace puts the binaries back at the target/
          # path env!("CARGO_BIN_EXE_*") baked in at compile time (target/ is
          # gitignored, so the residue guard does not see it). --no-fail-fast
          # matches cargo test: report every failure, not the first.
          bash scripts/test-tree-clean.sh cargo nextest run \
            --archive-file "$RUNNER_TEMP/nextest.tar.zst" \
            --workspace-remap "$GITHUB_WORKSPACE" --extract-to "$GITHUB_WORKSPACE" --extract-overwrite \
            --partition count:${{ matrix.shard }}/8 --no-fail-fast
          rc=$?
          if [ "$rc" = "3" ]; then
            echo "::warning title=Tree residue::A test left residue in the checkout. Advisory during the AF-150 trial period; the diff is above. Fix the FIXTURE, not .gitignore."
            exit 0
          fi
          exit $rc

  # One check name for the whole suite; a green subset cannot satisfy it.
  test:
    needs: test-shards
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every test shard to succeed
        env:
          SHARDS: ${{ needs.test-shards.result }}
        run: test "$SHARDS" = success

  e2e-shards:
    # PR Full Gate tier (plan §CI tiers): the golden scenarios in a real
    # browser against the real server + real extracted dashboard.
    runs-on: ubuntu-latest
    # AF-968: browser dependencies consumed 19m13s of one 30m runner,
    # cancelling a healthy shard. Keep the tests/deadlines; install them once
    # in the official image. Pin both version and digest, and verify below.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
      options: --init --ipc=host
    defaults:
      run:
        shell: bash
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      # AF-932. The `check` job installs tmux (above); this job never did.
      # The dashboard's own session/fleet code shells out to `tmux
      # list-sessions` and degrades gracefully (a WARN log, "fleet will read
      # as not-running") when it is missing — but a golden scenario that
      # asserts on real running-session state has nothing graceful to show
      # instead, so the gap surfaced as `element(s) not found` /
      # `toBeVisible()` failures rather than as this job's own missing step.
      - name: Install compiler and private server runtime
        # The browser image contains browser libraries, not Rust's C compiler
        # or the private HTTPS/tmux fixture tools. Install this smaller set.
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential pkg-config python3 tmux openssl lsof procps
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse --show-toplevel)" = "$GITHUB_WORKSPACE"
      - name: Install locked packages and verify preinstalled browsers
        env:
          AMUX_PLAYWRIGHT_IMAGE_VERSION: '1.62.1'
        run: |
          npm ci --ignore-scripts
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {createRequire} from 'node:module';
          const require = createRequire(import.meta.url);
          const version = require('@playwright/test/package.json').version;
          if (version !== process.env.AMUX_PLAYWRIGHT_IMAGE_VERSION) {
            throw new Error(`Playwright image/package mismatch: image=${process.env.AMUX_PLAYWRIGHT_IMAGE_VERSION} package=${version}`);
          }
          const {chromium, webkit} = require('playwright');
          for (const browser of [chromium, webkit]) {
            const executable = browser.executablePath();
            if (!fs.existsSync(executable)) throw new Error(`Missing ${browser.name()}: ${executable}`);
            const instance = await browser.launch({headless: true});
            console.log(JSON.stringify({verdict: 'ci_browser_ready', measured: true, n_considered: 1, browser: browser.name(), version: instance.version(), package: version, executable}));
            await instance.close();
          }
          JS
      - name: SPA static gate (no-undef kills the silent-dead-handler class)
        # Two silent-dead-handler bugs shipped in one week (schedule delete,
        # worker delete 2026-08-09): an undefined name in an async handler makes
        # the click do nothing. This gate fails the build on that class.
        run: bash scripts/spa-lint.sh
      - name: Dashboard outage recovery contracts
        run: node --test tests/dashboard-outage-recovery.mjs
      - name: No assignment to an undeclared client-side global (AF-940)
        run: node --test tests/spa-no-undeclared-global-assignment.test.mjs
      - name: Dashboard client unit tests (e2e/*.test.mjs)
        # These node:test suites used to ride inside Playwright, which loaded
        # them and counted none of their results (AMUX-5373).
        run: node --test e2e/*.test.mjs
      # The CI checkout IS committed HEAD, so serve-head's worktree hop is
      # pure duplicate work here — and worse: without these env vars the
      # prebuild below went to ./target while serve-head defaulted to
      # ~/.amux/rust-build-target, so CI paid a SECOND, uncached cold build
      # inside the webServer boot on every run (the old step comment claimed
      # the profile was "shared with webServer"; it stopped being true the
      # day serve-head started setting CARGO_TARGET_DIR — AMUX-2961).
      - name: Build server (the exact debug profile the webServer boots)
        run: cargo build -p amux-server
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
      - name: Golden scenarios (desktop + mobile + ios-safari)
        run: npx playwright test --config e2e/playwright.config.ts --workers=2 --shard=${{ matrix.shard }}/4 --global-timeout=1200000
        env:
          AMUX_E2E_EVIDENCE_DIR: ci-results/shard-${{ matrix.shard }}
          AMUX_E2E_WORKING_TREE: '1'
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
      # Runner deadline leaves time for partial evidence even when tests time out.
      - name: Upload execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # The attempt is in the name so "Re-run failed jobs" cannot be read
          # against the first attempt's evidence (run 37233408609: shard 4
          # passed on attempt 2 at 21:25, and the verdict still read attempt
          # 1's failing e2e-evidence-4 from 21:07).
          name: e2e-evidence-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: ci-results/
          if-no-files-found: error
          retention-days: 7
      - name: Upload traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

  # Preserve the e2e check name; a green subset cannot satisfy it.
  e2e:
    needs: e2e-shards
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm ci --ignore-scripts
      - name: Collect the full unchanged population (no execution claim)
        run: npx playwright test --config e2e/playwright.config.ts --list
        env:
          AMUX_E2E_EVIDENCE_DIR: ci-full
      - uses: actions/download-artifact@v4
        if: always()
        with:
          pattern: e2e-evidence-*
          path: ci-raw
      - name: Keep the newest attempt of each shard
        if: always()
        run: |
          set -euo pipefail
          mkdir -p ci-results
          # e2e-evidence-<shard>-attempt-<n>; a name without an attempt is 0.
          for d in ci-raw/e2e-evidence-*; do
            [ -d "$d" ] || continue
            b=$(basename "$d"); rest=${b#e2e-evidence-}; shard=${rest%%-*}
            att=0; case "$b" in *-attempt-*) att=${b##*-attempt-} ;; esac
            echo "$shard $att $d"
          done | sort -k1,1n -k2,2n | awk '{newest[$1]=$3} END {for (s in newest) print newest[s]}' | sort |
          while read -r d; do echo "== shard evidence from $(basename "$d")"; cp -R "$d"/. ci-results/; done
      - name: Require all shards and account for every test
        if: always()
        run: |
          set -o pipefail
          node scripts/check-e2e-evidence.mjs ci-results ci-full/manifest.json 4 | tee e2e-verdict.json
      - name: Require successful setup and test jobs too
        if: always()
        env:
          SHARD_RESULT: ${{ needs.e2e-shards.result }}
        run: test "$SHARD_RESULT" = success
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-verdict
          path: e2e-verdict.json
          if-no-files-found: error
          retention-days: 7
