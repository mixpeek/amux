name: Cloud limit probe (run the SHIPPED parser against a LIVE pane)

# Why this exists: a rate/credit-limit field can read 0 in prod while the same
# parser passes locally against what looks like the same pane. The difference is
# always in bytes nobody printed — glyph variants, chrome, ANSI that survived
# stripping, or a scan loop that never ran the parser at all.
#
# So this does not reimplement anything. It extracts the parser functions from
# the RUNNING server's own file inside the container and runs them against the
# LIVE tmux pane, printing every stage with repr() so invisible differences are
# visible. If the final stage returns a value but the field still reads 0, the
# parser is fine and the scan loop is the bug — a different fix.
#
# Sessions have no SSH to the cloud host and neither does the amux session that
# usually needs this; CI holds the key. Read-only: captures panes and reads logs.

on:
  workflow_dispatch:
    inputs:
      org:
        description: 'org id (container amux-user-<org>)'
        required: true
      session:
        description: 'session name to probe'
        required: false
        default: 'stacking-copilot'

env:
  CLOUD_HOST: ${{ vars.CLOUD_HOST || '34.121.177.76' }}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.CLOUD_SSH_KEY }}" > ~/.ssh/amux_cloud
          chmod 600 ~/.ssh/amux_cloud
          ssh-keyscan -H "$CLOUD_HOST" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Stage probe against the live pane
        env:
          ORG: ${{ inputs.org }}
          SESSION: ${{ inputs.session }}
        run: |
          ssh -i ~/.ssh/amux_cloud root@"$CLOUD_HOST" \
            "ORG='$ORG' SESSION='$SESSION' bash -s" <<'ENDSSH'
            C="amux-user-${ORG}"
            echo "container: $C   session: $SESSION"
            echo "=== which build is this container running ==="
            docker exec "$C" sh -lc 'curl -s localhost:8822/health' 2>&1 \
              | tr ',' '\n' | grep -E '"(build|uptime_s)"' | sed 's/^/  /'

            # The server file hash identifies amux-server.py and says NOTHING
            # about the IMAGE — which matters whenever a fix lives in the
            # Dockerfile rather than the source. AC-153's autostart ENV is
            # exactly that case: a container can carry the new server code and
            # still predate the image that sets the flag, and without these
            # three lines "the flag is set and did nothing" is indistinguishable
            # from "the flag was never set".
            echo "=== container provenance (image vs source are different facts) ==="
            docker inspect "$C" --format 'image={{.Image}}' 2>&1 | sed 's/^/     /'
            docker inspect "$C" --format 'image_name={{.Config.Image}}' 2>&1 | sed 's/^/     /'
            docker inspect "$C" --format 'created={{.Created}}' 2>&1 | sed 's/^/     /'
            docker inspect "$C" --format 'started={{.State.StartedAt}}' 2>&1 | sed 's/^/     /'
            echo "  AMUX_AUTOSTART_SESSIONS in container env:"
            docker exec "$C" sh -lc 'printenv AMUX_AUTOSTART_SESSIONS || echo "(unset)"' 2>&1 \
              | sed 's/^/     /'
            echo "  ...and in server.env (the other way it can arrive):"
            docker exec "$C" sh -lc 'grep -s AMUX_AUTOSTART_SESSIONS /root/.amux/server.env || echo "(absent)"' 2>&1 \
              | sed 's/^/     /'

            echo
            echo "=== stage probe (SHIPPED functions vs LIVE pane) ==="
            docker exec -i "$C" python3 - "$SESSION" <<'PROBE'
          import os, re, subprocess, sys, time
          SESSION = sys.argv[1] if len(sys.argv) > 1 else "stacking-copilot"
          ps = subprocess.run(["sh","-c","ps ax -o command | grep 'amux-server.py' | grep -v grep | head -1"],
                              capture_output=True, text=True).stdout
          SRC = next((t for t in ps.split() if t.endswith("amux-server.py")), "/app/amux-server.py")
          # RUST CUTOVER (AMUX-2619). This probe reads _LIMIT_ACTIVITY_RE and
          # _API_ERROR_RE out of the RUNNING PYTHON SOURCE and exec()s them.
          # Against the rust image there is no such file, and the honest failure
          # is a named one: a traceback here, or a skipped section, is easy to
          # read as "no rate limiting detected", which is the opposite of what
          # this probe found. Port the two regexes from crates/amux-server (they
          # live in api/session_verbs.rs) or delete this section.
          if not os.path.exists(SRC):
              print("::warning::stage probe SKIPPED — this container runs the rust "
                    "server, so there is no amux-server.py to read the regexes from. "
                    "This is NOT a finding: it means the probe could not look.")
              print("stage probe: unavailable on the rust image (see the warning above)")
              sys.exit(0)
          print("server file:", SRC)
          src = open(SRC, encoding="utf-8").read()
          def grab(a, b):
              i = src.index(a); return src[i:src.index(b, i)]
          ns = {"re": re, "time": time}
          exec(grab("_LIMIT_ACTIVITY_RE = ", "def _rate_limit_budget_state"), ns)
          exec(grab("_API_ERROR_RE = ", "def _api_error_state"), ns)
          for tname in (f"amux-{SESSION}", SESSION):
              r = subprocess.run(["tmux","capture-pane","-t",tname,"-p","-S","-300"],
                                 capture_output=True, text=True)
              if r.returncode == 0:
                  break
          print("tmux target:", tname, "rc:", r.returncode)
          raw = r.stdout
          clean = re.sub(r"\x1b\[[0-9;?]*[a-zA-Z]", "", raw)
          tail = [l for l in clean.splitlines() if l.strip()][-8:]
          print("-- last 8 non-empty lines (repr) --")
          for l in tail:
              print(repr(l))
          marker, lines = ns["_api_error_region"](clean)
          print("marker:", repr(marker))
          print("marker matches QUOTA_MARKER:",
                bool(ns["_API_QUOTA_MARKER_RE"].match(marker)) if marker else "(no marker)")
          flat = "".join(lines)
          print("phrase in flat:", bool(ns["_API_QUOTA_PHRASE_RE"].search(flat)))
          m = ns["_API_QUOTA_RESET_RE"].search(flat)
          print("reset groups:", m.groups() if m else None)
          print("FINAL _api_quota_reset:", ns["_api_quota_reset"](clean))
          PROBE

            echo
            echo "=== did the SCAN LOOP ever run it? (container log) ==="
            # If FINAL above returns a timestamp but the field reads 0, the
            # parser is fine and nothing called it — these lines say which.
            docker logs --tail 400 "$C" 2>&1 \
              | grep -E "\[api-quota\]|\[rate-limit\]|\[limits\]" | tail -20 | sed 's/^/  /' \
              || echo "  (no [api-quota] / [rate-limit] lines in the last 400)"

            echo
            echo "=== what the API reports for this session ==="
            docker exec "$C" sh -lc "curl -s localhost:8822/api/sessions" 2>&1 \
              | python3 -c "
          import json,sys
          try: rows=json.load(sys.stdin)
          except Exception as e: print('  unparsable:', e); raise SystemExit
          for s in rows:
              if s.get('name')=='$SESSION':
                  for k in ('running','status','rate_limited_until','credit_limited',
                            'credit_limit_model','api_error','api_error_code',
                            'rate_limit_banner','rate_limit_weekly'):
                      print(f'  {k:20s} = {s.get(k)!r}')
          " 2>&1
          ENDSSH
