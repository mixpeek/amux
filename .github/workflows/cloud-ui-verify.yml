name: Cloud UI verify (dashboard renders in a real browser)

# Proves the workspace DASHBOARD — not just the API — renders inside a cloud
# container, using amux's own headless browser to load it. Checks that the
# sessions tmux actually has show up as cards, so "the API returns sessions"
# and "a person can see their sessions" stop being the same claim.
#
# Needs no credentials: it drives the container's own server directly, which is
# the same UI the gateway proxies. The gateway only adds auth in front of it.

on:
  workflow_dispatch:
    inputs:
      org:
        description: 'org id (container amux-user-<org>)'
        required: true

env:
  CLOUD_HOST: ${{ vars.CLOUD_HOST || '34.121.177.76' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.CLOUD_SSH_KEY }}" > ~/.ssh/amux_cloud
          chmod 600 ~/.ssh/amux_cloud
          ssh-keyscan -H "$CLOUD_HOST" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Render the dashboard and assert sessions are visible
        env:
          ORG: ${{ inputs.org }}
        run: |
          ssh -i ~/.ssh/amux_cloud root@"$CLOUD_HOST" "ORG='$ORG' bash -s" <<'ENDSSH'
            C="amux-user-${ORG}"
            ex() { docker exec "$C" sh -lc "$1" 2>&1; }
            api() {
              printf '%s' "$2" | docker exec -i "$C" sh -c \
                "cat > /tmp/uireq.json && curl -sS --max-time 90 -X POST \
                 localhost:8822/api/browser/$1 -H 'Content-Type: application/json' \
                 -d @/tmp/uireq.json" 2>&1
            }
            evl() {
              api action "{\"action\":\"eval\",\"script\":\"$(printf '%s' "$1" | sed 's/\\/\\\\/g; s/"/\\"/g')\",\"session\":\"uiprobe\"}"
            }

            echo "=== ground truth: what tmux actually has ==="
            SESS=$(ex 'tmux list-sessions -F "#{session_name}" 2>/dev/null')
            echo "$SESS" | sed 's/^/  /'

            echo
            echo "=== render the dashboard in the container's own browser ==="
            api start "{\"url\":\"http://localhost:8822/\",\"session\":\"uiprobe\"}"
            echo
            echo "  waiting for the app to hydrate (it fetches sessions after load)"
            sleep 12

            echo "  title:  $(evl "document.title" )"
            echo "  cards:  $(evl "String(document.querySelectorAll('#cards > *').length)")"
            echo "  tabs:   $(evl "Array.from(document.querySelectorAll('.tab')).map(function(e){return e.innerText.trim()}).join(',')")"
            TXT=$(evl "((document.getElementById('cards')||{}).innerText||'').slice(0,1500)")
            echo "  card text (truncated):"
            echo "$TXT" | sed 's/^/    /'

            echo
            echo "=== screenshot (proves pixels, not just DOM) ==="
            ex "curl -sS --max-time 60 'localhost:8822/api/browser/screenshot?session=uiprobe'" | sed 's/^/  /'

            api stop "{\"session\":\"uiprobe\"}" >/dev/null 2>&1

            echo
            echo "=== VERDICT ==="
            MISS=0
            # tmux names carry the amux- prefix; the dashboard displays the bare
            # name. Comparing the raw strings marked every correctly-rendered
            # session as MISSING — a red verdict on a working UI.
            for s in $SESS; do
              disp="${s#amux-}"
              case "$TXT" in
                *"$disp"*) echo "  visible: $disp" ;;
                *)         echo "  MISSING FROM UI: $disp (tmux: $s)"; MISS=1 ;;
              esac
            done
            if [ -z "$SESS" ]; then
              echo "  INCONCLUSIVE — the container has no tmux sessions to display"
              exit 1
            fi
            if [ "$MISS" = 0 ]; then
              echo "  PASS — every tmux session is rendered as a card in the dashboard"
            else
              echo "  FAIL — the dashboard does not show sessions that exist"
              exit 1
            fi
          ENDSSH
