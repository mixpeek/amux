name: rust-soak
# RR-0117a — PERIODIC SOAK GATE (weekly).
#
# Long-running resource and lifecycle behaviour: sustained load, DB growth,
# SSE reconnect, FD/RSS leak detection.
#
# THE DURATION, HONESTLY. The plan asks for a 24h soak and 48h leak detection.
# A GitHub-hosted runner caps a single job at 6 hours, so:
#
#   * the default weekly run is 4 HOURS, which fits and is a real signal;
#   * `soak_minutes` is a dispatch input, so a self-hosted runner can be given
#     the full 24h/48h;
#   * this workflow NEVER claims a duration it did not run — the summary prints
#     the minutes actually soaked.
#
# The alternative (labelling a 20-minute run "48h soak") is the failure mode
# where a gate's name is the only thing anyone reads.

on:
  schedule:
    # Sunday 04:00 UTC — the quietest window, and a full weekday to react.
    - cron: '0 4 * * 0'
  workflow_dispatch:
    inputs:
      soak_minutes:
        description: 'Minutes to soak (hosted runners cap the job at 6h = 360m)'
        default: '240'
      rss_growth:
        description: 'Max fractional RSS growth from the post-warmup baseline'
        default: '0.20'
      fd_growth:
        description: 'Max absolute file-descriptor growth from the post-warmup baseline'
        default: '50'
      malloc_arena_max:
        description: >-
          glibc MALLOC_ARENA_MAX for this run. Empty leaves it UNSET, and the
          server then caps itself at 2 (crates/amux-server/src/main.rs, AF-1134).
          A value here overrides that cap. It exists for the AMUX-4810 A/B: glibc creates
          up to 8 x ncores per-thread arenas and rarely returns their memory to
          the OS, which would explain in-run RSS growth that scales with
          SOAK_CONCURRENCY (0.41-0.62 at 4, 0.76-1.47 at 8) and decelerates to a
          plateau without leaking descriptors.
        default: ''
      server_env:
        description: >-
          Extra KEY=VALUE pairs (space separated) exported for the server in
          this run, to isolate one subsystem in an A/B, e.g.
          AMUX_AUTOFIX_SECS=0 (AMUX-5565). Empty changes nothing.
        default: ''

permissions:
  contents: read

jobs:
  soak:
    name: sustained-load soak (FD / RSS)
    runs-on: ubuntu-latest
    # +30m over the soak itself for build and teardown; the hosted ceiling is
    # 360m, so a longer soak needs a self-hosted runner and this will fail
    # loudly rather than being silently truncated.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p amux-server

      - name: Refuse a duration this runner cannot honour
        env:
          MINUTES: ${{ github.event.inputs.soak_minutes || '240' }}
        run: |
          if [ "$MINUTES" -gt 300 ]; then
            echo "FAIL: soak_minutes=$MINUTES exceeds what a GitHub-hosted runner can complete (job cap 360m, minus build time)."
            echo "Run this on a self-hosted runner for the plan's 24h/48h figures, or lower soak_minutes."
            exit 1
          fi
          echo "soaking for $MINUTES minutes"

      - name: Soak
        env:
          SOAK_MINUTES: ${{ github.event.inputs.soak_minutes || '240' }}
          SOAK_SAMPLE_S: '60'
          SOAK_RSS_GROWTH: ${{ github.event.inputs.rss_growth || '0.20' }}
          SOAK_FD_GROWTH: ${{ github.event.inputs.fd_growth || '50' }}
          SOAK_CONCURRENCY: '8'
          ARENA_MAX_INPUT: ${{ github.event.inputs.malloc_arena_max || '' }}
          SERVER_ENV_INPUT: ${{ github.event.inputs.server_env || '' }}
        # `set -o pipefail` is load-bearing, not tidiness. GitHub's default
        # shell for `run:` is `bash -e {0}`, WITHOUT pipefail, so a pipeline
        # exits with the status of its LAST command. `tee` always succeeds, so
        # soak-probe.sh's `exit 1` was discarded and this gate could not fail.
        # Measured 2026-09-18: five consecutive weekly runs (08-16 through
        # 09-13) printed "FAIL: RSS grew ..." and reported success, growth
        # 0.76-1.47 against a 0.20 threshold. The next step below already sets
        # `set -euo pipefail` inside its own block, which is why this one read
        # as deliberate. See AMUX-4742.
        run: |
          set -o pipefail
          # Exported only when the dispatch input is non-empty, so the
          # scheduled run's behaviour is byte-identical to before. An empty
          # MALLOC_ARENA_MAX is NOT the same as an unset one to glibc, which is
          # why this is a conditional export rather than a plain env: entry.
          if [ -n "${ARENA_MAX_INPUT:-}" ]; then
            export MALLOC_ARENA_MAX="$ARENA_MAX_INPUT"
            echo "== MALLOC_ARENA_MAX=$MALLOC_ARENA_MAX (AMUX-4810 arena A/B)"
          else
            echo "== MALLOC_ARENA_MAX unset (shipped default)"
          fi
          # Each pair must be NAME=VALUE with a plain env name, so a dispatch
          # input cannot smuggle shell into this step.
          for kv in ${SERVER_ENV_INPUT:-}; do
            if [[ "$kv" =~ ^[A-Z_][A-Z0-9_]*=[A-Za-z0-9_.,:/-]*$ ]]; then
              export "$kv"; echo "== server env $kv (A/B arm)"
            else
              echo "FAIL: server_env entry '$kv' is not NAME=VALUE"; exit 1
            fi
          done
          bash scripts/soak-probe.sh | tee soak.log

      - name: Database growth under churn
        # DB growth/compaction from the plan's soak list. A WAL that never
        # checkpoints is a real production failure and is invisible from
        # request latency until the disk fills.
        run: |
          set -euo pipefail
          WORK=$(mktemp -d)
          BIN=./target/release/amux-server
          AMUX_HOME=$WORK AMUX_DB=$WORK/amux.db AMUX_RS_PORT=18977 $BIN >$WORK/s.log 2>&1 &
          PID=$!
          for _ in $(seq 1 60); do curl -sk --max-time 2 https://localhost:18977/health >/dev/null 2>&1 && break; sleep 0.5; done
          TOKEN=$(cat $WORK/auth-token 2>/dev/null || echo "")
          for i in $(seq 1 500); do
            curl -sk -o /dev/null -X POST -H "Content-Type: application/json" -H "Authorization: Bearer $TOKEN" \
              -H "X-Amux-Session: soak" -d "{\"title\":\"soak card $i\",\"status\":\"todo\"}" \
              https://localhost:18977/api/board
          done
          SIZE_A=$(stat -c%s $WORK/amux.db 2>/dev/null || stat -f%z $WORK/amux.db)
          WAL_A=$(stat -c%s $WORK/amux.db-wal 2>/dev/null || stat -f%z $WORK/amux.db-wal 2>/dev/null || echo 0)
          echo "after 500 writes: db=${SIZE_A}B wal=${WAL_A}B"
          kill $PID; sleep 2
          WAL_B=$(stat -c%s $WORK/amux.db-wal 2>/dev/null || stat -f%z $WORK/amux.db-wal 2>/dev/null || echo 0)
          echo "after clean shutdown: wal=${WAL_B}B"
          # WAL must checkpoint on close (db/mod.rs relies on this for shutdown).
          if [ "$WAL_B" -gt 4194304 ]; then
            echo "FAIL: WAL is ${WAL_B}B after a clean shutdown — it is not checkpointing"
            exit 1
          fi
          echo "db growth check OK"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soak-log
          path: soak.log
          retention-days: 30

      - name: Summary
        if: always()
        env:
          MINUTES: ${{ github.event.inputs.soak_minutes || '240' }}
        run: echo "SOAK GATE ran for ${MINUTES} minutes on a github-hosted runner (plan asks 24h/48h; that needs a self-hosted runner)"
