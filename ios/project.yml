name: AmuxApp
options:
  bundleIdPrefix: io.amux
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: 5.9
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: 1
    PRODUCT_BUNDLE_IDENTIFIER: com.EthanSteininger.nextup
    DEVELOPMENT_TEAM: "M225B6YA42"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1,2"  # iPhone + iPad
    SWIFT_STRICT_CONCURRENCY: minimal
targets:
  AmuxApp:
    type: application
    platform: iOS
    settings:
      base:
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Distribution"
        PROVISIONING_PROFILE_SPECIFIER: "match AppStore com.EthanSteininger.nextup"
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "match AppStore com.EthanSteininger.nextup"
        Release:
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "match AppStore com.EthanSteininger.nextup"
    dependencies:
      - target: AmuxShare
    sources:
      - path: AmuxApp/Sources
      - path: AmuxApp/Assets.xcassets
    info:
      path: AmuxApp/Info.plist
      properties:
        # THE SHARE SHEET LABELS THE ROW WITH THE CONTAINING APP'S NAME, not
        # the extension's. AmuxShare already sets CFBundleDisplayName: amux and
        # the row still read "AmuxApp" (measured in the simulator's share sheet:
        # cell id 'shareCell', label 'AmuxApp'), because iOS takes the name from
        # here. Ethan went looking for "amux" in the sheet's app list, so the
        # name it shows is the name people search for.
        #
        # Same key drives the home-screen icon label, which also read "AmuxApp".
        CFBundleDisplayName: amux
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSFaceIDUsageDescription: "Used to protect access to your amux dashboard"
        ITSAppUsesNonExemptEncryption: false
        CFBundleIconName: AppIcon
    entitlements:
      # XcodeGen GENERATES this file and overwrites hand edits, exactly like
      # the `info:` plist above. Declaring the App Group here is what makes it
      # survive `xcodegen generate`.
      path: AmuxApp/AmuxApp.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.EthanSteininger.nextup

  # Unit tests (AMUX-4981). Hostless logic tests: they exercise pure parsing,
  # so they need no app to launch and run in seconds.
  #
  # AmuxClient.swift is listed here so it compiles INTO this target, the same
  # mechanism AmuxStore.swift already uses to reach both app and extension.
  # That is what lets the tests call the shipping function instead of a copy
  # of it — before this target existed there was nowhere for an iOS test to
  # live, and the AMUX-4976 verification had to duplicate the parser body into
  # standalone scripts that cannot notice a later edit.
  AmuxAppTests:
    type: bundle.unit-test
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.EthanSteininger.nextup.Tests
        GENERATE_INFOPLIST_FILE: "YES"
        # Overrides the project-wide manual signing above: a simulator logic
        # test needs no identity, and inheriting "Apple Distribution" would
        # make this target unbuildable without the release credentials.
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
    sources:
      - path: AmuxAppTests
      - path: AmuxShare/Sources/AmuxClient.swift

  # UI tests that drive the SYSTEM SHARE SHEET from another app (AMUX-4990).
  #
  # Separate from AmuxAppTests because this needs `bundle.ui-testing`: a UI
  # test runs out of process and drives springboard, which a logic-test bundle
  # cannot do. It is also the only place the extension is exercised as an
  # EXTENSION rather than as a library — AmuxAppTests compiles AmuxClient.swift
  # in and calls it directly, which cannot notice a missing NSExtension dict, a
  # wrong activation rule, or an App Group the two targets disagree about.
  AmuxShareUITests:
    type: bundle.ui-testing
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.EthanSteininger.nextup.UITests
        GENERATE_INFOPLIST_FILE: "YES"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        TEST_TARGET_NAME: AmuxApp
    sources:
      - path: AmuxShareUITests
    dependencies:
      - target: AmuxApp

  # Share Extension: puts amux in the iOS share sheet (AMUX-4940).
  #
  # A PWA cannot do this. iOS Safari does not implement the Web Share Target
  # API, so `share_target` in manifest.json reaches Android and desktop Chrome
  # and never the iPhone. A native extension is the only route, and this app
  # is what makes it available.
  #
  # AmuxStore.swift is compiled into BOTH targets deliberately: the extension
  # is a separate process and needs the same App Group keys the app writes.
  AmuxShare:
    type: app-extension
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.EthanSteininger.nextup.Share
        PRODUCT_NAME: AmuxShare
        GENERATE_INFOPLIST_FILE: "NO"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Distribution"
        PROVISIONING_PROFILE_SPECIFIER: "match AppStore com.EthanSteininger.nextup.Share"
      configs:
        Debug:
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "match AppStore com.EthanSteininger.nextup.Share"
        Release:
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "match AppStore com.EthanSteininger.nextup.Share"
    sources:
      - path: AmuxShare/Sources
      - path: AmuxApp/Sources/AmuxStore.swift
    info:
      # XcodeGen GENERATES this plist from the properties below and overwrites
      # whatever is at that path. A hand-written AmuxShare/Info.plist is
      # silently discarded: the build still succeeds, and ships an extension
      # with no NSExtension dict, which iOS never shows in the share sheet.
      # Verified by doing exactly that once. Keep the NSExtension config HERE.
      path: AmuxShare/Info.plist
      properties:
        CFBundleDisplayName: amux
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundlePackageType: XPC!
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 20
              NSExtensionActivationSupportsMovieWithMaxCount: 5
              NSExtensionActivationSupportsFileWithMaxCount: 20
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsWebPageWithMaxCount: 1
    entitlements:
      # The group MUST match the host app's, or the extension reads an empty
      # suite and reports "no amux server selected" forever.
      path: AmuxShare/AmuxShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.EthanSteininger.nextup

# XcodeGen auto-creates a scheme for application and unit-test targets and NOT
# for `bundle.ui-testing`, so without this block the target builds and
# `xcodebuild test -scheme AmuxShareUITests` fails with "scheme not found" —
# which reads like a typo rather than a missing scheme.
schemes:
  # DECLARING ANY scheme here turns OFF XcodeGen's auto-generation for every
  # target named in one. AmuxApp is named below, so it needs its own entry or
  # `-scheme AmuxApp` (what ios-build.yml uses) stops resolving.
  AmuxApp:
    build:
      targets:
        AmuxApp: all
    test:
      targets:
        - AmuxAppTests
    run:
      config: Debug

  # Named explicitly for the same reason: it appears in AmuxApp's test list
  # above, so XcodeGen stops generating it, and ios-build.yml runs
  # `-scheme AmuxAppTests`.
  AmuxAppTests:
    build:
      targets:
        AmuxAppTests: [test]
    test:
      targets:
        - AmuxAppTests

  AmuxShareUITests:
    build:
      targets:
        # The HOST APP has to be in this list. With only the test bundle here
        # xcodebuild does not install AmuxApp, the share extension is therefore
        # not registered, and the sheet comes back
        # ["Reminders", "Preview", "More"] — a real-looking failure caused
        # entirely by the rig. Measured exactly that way once.
        AmuxApp: [test]
        AmuxShareUITests: [test]
    test:
      targets:
        - AmuxShareUITests
